<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espanhol: vocabulário · Aprende+</title>
<meta name="description" content="Parecem iguais mas não são: as palavras de espanhol que mais enganam.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
const main = K.page({ title: "Espanhol: vocabulário", subject: 'lin', emoji: '🇪🇸', key: 'evio', intro: "Cuidado com os <b>falsos amigos</b>: em espanhol «exquisito» quer dizer delicioso, «embarazada» quer dizer grávida e «polvo» quer dizer pó." });
const box = K.el('div'); main.append(box);
const P = [["cão", "perro"], ["rapaz", "chico"], ["coelho", "conejo"], ["cenoura", "zanahoria"], ["janela", "ventana"], ["comboio", "tren"], ["obrigado", "gracias"], ["pequeno-almoço", "desayuno"], ["almoço", "almuerzo"], ["amanhã", "mañana"], ["sempre", "siempre"], ["polvo", "pulpo"], ["pó", "polvo"], ["delicioso", "exquisito"], ["grávida", "embarazada"], ["borracha", "goma"], ["escritório", "oficina"], ["apelido", "apellido"], ["cadeira", "silla"], ["almofada", "almohada"], ["laranja", "naranja"], ["esquerda", "izquierda"]];
function gen() {
  const [a, b] = K.one(P), rev = true && Math.random() < .5;
  const pool = P.map(x => rev ? x[0] : x[1]).filter((v, i, s) => s.indexOf(v) === i && v !== (rev ? a : b));
  const ans = rev ? a : b, o = K.shuffle([ans, ...K.pick(pool, 3)]);
  return { q: rev ? 'O que quer dizer <b>' + b + '</b> em espanhol?' : 'Como se diz <b>' + a + '</b> em espanhol?', o, a: ans, e: '<b>' + a + '</b> = <b>' + b + '</b>.' };
}
K.quiz(box, { key: 'evio', gen, n: 10 });
</script>
</body>
</html>

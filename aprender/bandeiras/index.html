<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandeiras do mundo · Aprende+</title>
<meta name="description" content="Olha para a bandeira e diz de que país é (ou o contrário).">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
const main = K.page({ title: "Bandeiras do mundo", subject: 'geo', emoji: '🏳️', key: 'bas', intro: "Muitas bandeiras parecem-se: a da Irlanda (verde, branco, laranja) e a de Itália (verde, branco, vermelho) por exemplo." });
const box = K.el('div'); main.append(box);
const P = [["🇵🇹", "Portugal"], ["🇪🇸", "Espanha"], ["🇫🇷", "França"], ["🇮🇹", "Itália"], ["🇩🇪", "Alemanha"], ["🇬🇧", "Reino Unido"], ["🇮🇪", "Irlanda"], ["🇧🇪", "Bélgica"], ["🇳🇱", "Países Baixos"], ["🇨🇭", "Suíça"], ["🇦🇹", "Áustria"], ["🇵🇱", "Polónia"], ["🇬🇷", "Grécia"], ["🇸🇪", "Suécia"], ["🇳🇴", "Noruega"], ["🇫🇮", "Finlândia"], ["🇩🇰", "Dinamarca"], ["🇺🇦", "Ucrânia"], ["🇧🇷", "Brasil"], ["🇺🇸", "Estados Unidos"], ["🇨🇦", "Canadá"], ["🇲🇽", "México"], ["🇦🇷", "Argentina"], ["🇯🇵", "Japão"], ["🇨🇳", "China"], ["🇮🇳", "Índia"], ["🇰🇷", "Coreia do Sul"], ["🇦🇴", "Angola"], ["🇲🇿", "Moçambique"], ["🇨🇻", "Cabo Verde"], ["🇲🇦", "Marrocos"], ["🇪🇬", "Egito"], ["🇿🇦", "África do Sul"], ["🇦🇺", "Austrália"], ["🇹🇷", "Turquia"], ["🇭🇷", "Croácia"]];
function gen() {
  const [a, b] = K.one(P), rev = true && Math.random() < .5;
  const pool = P.map(x => rev ? x[0] : x[1]).filter((v, i, s) => s.indexOf(v) === i && v !== (rev ? a : b));
  const ans = rev ? a : b, o = K.shuffle([ans, ...K.pick(pool, 3)]);
  return { q: rev ? 'Qual é a bandeira de <b>' + b + '</b>?' : 'De que país é esta bandeira? <span style="font-size:56px;display:block;margin-top:8px">' + a + '</span>', o, a: ans, e: '<span style="font-size:28px">' + a + '</span> é a bandeira de <b>' + b + '</b>.' };
}
K.quiz(box, { key: 'bas', gen, n: 10 });
</script>
</body>
</html>

<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglês: vocabulário · Aprende+</title>
<meta name="description" content="Escola, casa, comida, animais e cores em inglês: traduz nos dois sentidos.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
const main = K.page({ title: "Inglês: vocabulário", subject: 'lin', emoji: '🇬🇧', key: 'ivio', intro: "Treina o vocabulário mais usado nas aulas de inglês do 3.º ciclo." });
const box = K.el('div'); main.append(box);
const P = [["escola", "school"], ["livro", "book"], ["caneta", "pen"], ["mesa", "table"], ["cadeira", "chair"], ["janela", "window"], ["porta", "door"], ["casa", "house"], ["cozinha", "kitchen"], ["quarto", "bedroom"], ["maçã", "apple"], ["pão", "bread"], ["leite", "milk"], ["água", "water"], ["cão", "dog"], ["gato", "cat"], ["pássaro", "bird"], ["cavalo", "horse"], ["vermelho", "red"], ["amarelo", "yellow"], ["verde", "green"], ["azul", "blue"], ["segunda-feira", "Monday"], ["sexta-feira", "Friday"], ["irmão", "brother"], ["irmã", "sister"], ["avô", "grandfather"], ["praia", "beach"], ["comboio", "train"], ["bicicleta", "bike"]];
function gen() {
  const [a, b] = K.one(P), rev = true && Math.random() < .5;
  const pool = P.map(x => rev ? x[0] : x[1]).filter((v, i, s) => s.indexOf(v) === i && v !== (rev ? a : b));
  const ans = rev ? a : b, o = K.shuffle([ans, ...K.pick(pool, 3)]);
  return { q: rev ? 'O que quer dizer <b>' + b + '</b>?' : 'Como se diz <b>' + a + '</b> em inglês?', o, a: ans, e: '<b>' + a + '</b> = <b>' + b + '</b>.' };
}
K.quiz(box, { key: 'ivio', gen, n: 10 });
</script>
</body>
</html>

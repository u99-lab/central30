<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fases da Lua · Aprende+</title>
<meta name="description" content="Simulador das fases da Lua ao longo de um mês lunar.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit.css">

</head>
<body>
<script src="../kit.js"></script>

<script>
const main = K.page({ title: 'Fases da Lua', subject: 'cie', emoji: '🌙', key: 'lua',
  intro: 'A Lua não tem luz própria: reflete a luz do Sol. Conforme dá a volta à Terra (cerca de 29,5 dias), vemos partes diferentes iluminadas. Mexe no dia para ver.' });
const CYC = 29.53;
const NAMES = ['Lua Nova', 'Quarto Crescente', 'Lua Cheia', 'Quarto Minguante'];
function phaseName(d) {
  const k = d / CYC * 4, i = Math.round(k) % 4, off = Math.abs(k - Math.round(k));
  if (off < 0.25) return NAMES[i];
  const f = Math.floor(k) % 4;
  return ['Entre a Lua Nova e o Quarto Crescente', 'Entre o Quarto Crescente e a Lua Cheia', 'Entre a Lua Cheia e o Quarto Minguante', 'Entre o Quarto Minguante e a Lua Nova'][f] + (f < 2 ? ' (a crescer)' : ' (a minguar)');
}
function moonPath(d, R, cx, cy) {
  const ph = (d / CYC) % 1;               // 0 nova, .5 cheia
  const k = Math.cos(ph * 2 * Math.PI);   // 1 nova, -1 cheia
  const right = ph < 0.5;                 // a crescer: lado direito iluminado (hemisfério Norte)
  const rx = Math.abs(k) * R;
  const s1 = right ? 1 : 0;
  const s2 = (k > 0) === right ? 0 : 1;
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#1f2a33"/>` +
    (ph < 0.02 || ph > 0.98 ? '' : `<path d="M${cx} ${cy - R} A ${R} ${R} 0 0 ${s1} ${cx} ${cy + R} A ${rx} ${R} 0 0 ${s2} ${cx} ${cy - R} Z" fill="#f1ecd8"/>`) +
    `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#ffffff33"/>`;
}
function scene(d) {
  const a = (d / CYC) * 2 * Math.PI;      // 0 = entre a Terra e o Sol
  const ex = 200, ey = 170, r = 110;
  const mx = ex - Math.cos(a) * r, my = ey + Math.sin(a) * r;
  let s = `<rect width="640" height="340" fill="#0b1014"/>`;
  for (let i = 0; i < 7; i++) s += `<line x1="0" y1="${50 + i * 40}" x2="40" y2="${50 + i * 40}" stroke="#ffd34d" stroke-width="2" opacity=".6"/>`;
  s += `<text x="20" y="28" fill="#ffd34d" font-family="Inter" font-size="13" font-weight="700">☀ Luz do Sol</text>`;
  s += `<circle cx="${ex}" cy="${ey}" r="${r}" fill="none" stroke="#ffffff22" stroke-dasharray="4 5"/>`;
  s += `<circle cx="${ex}" cy="${ey}" r="26" fill="#4fa3e0"/><path d="M${ex} ${ey - 26} A26 26 0 0 1 ${ex} ${ey + 26} Z" fill="#0b1014" opacity=".55"/><text x="${ex}" y="${ey + 46}" text-anchor="middle" fill="#93a29c" font-family="Inter" font-size="12">Terra</text>`;
  s += `<circle cx="${mx}" cy="${my}" r="13" fill="#f1ecd8"/><path d="M${mx} ${my - 13} A13 13 0 0 1 ${mx} ${my + 13} Z" fill="#0b1014" opacity=".75"/>`;
  s += `<text x="200" y="320" text-anchor="middle" fill="#93a29c" font-family="Inter" font-size="12">Vista de cima (não está à escala)</text>`;
  s += `<line x1="400" y1="20" x2="400" y2="320" stroke="#ffffff14"/>`;
  s += moonPath(d, 82, 520, 160) + `<text x="520" y="272" text-anchor="middle" fill="#93a29c" font-family="Inter" font-size="12">Como a vemos da Terra (hemisfério Norte)</text>`;
  return K.svg(640, 340, s, 'style="width:100%;height:auto;border-radius:12px"');
}
let day = 7.4;
const pic = K.el('div');
const name = K.el('div', { class: 'q', style: 'margin:12px 0 4px', 'aria-live': 'polite' });
const dl = K.el('span', { class: 'muted' });
const rng = K.el('input', { type: 'range', id: 'dia', min: 0, max: 29.5, step: 0.1, value: day, 'aria-label': 'Dia do ciclo lunar' });
function draw() { pic.innerHTML = scene(day); name.textContent = phaseName(day); dl.textContent = 'Dia ' + day.toFixed(1).replace('.', ',') + ' de 29,5'; }
rng.addEventListener('input', () => { day = +rng.value; draw(); });
let timer = null;
const play = K.el('button', { class: 'btn', onclick: () => { if (timer) { clearInterval(timer); timer = null; play.textContent = '▶ Animar'; } else { timer = setInterval(() => { day = (day + 0.25) % 29.5; rng.value = day; draw(); }, 60); play.textContent = '⏸ Parar'; } } }, '▶ Animar');
const jumps = K.el('div', { class: 'tabs' }, NAMES.map((n, i) => K.el('button', { onclick: () => { day = +(i * CYC / 4).toFixed(1); rng.value = day; draw(); } }, n)));
main.append(K.el('div', { class: 'card' }, pic, name, K.el('div', { class: 'row', style: 'margin:6px 0 10px' }, dl), rng, K.el('div', { class: 'row', style: 'margin-top:12px' }, play, jumps)));
draw();
const box = K.el('div'); main.append(box);
const fixed = [
  { q: 'Quanto tempo dura, aproximadamente, um ciclo de fases da Lua?', o: ['29,5 dias', '7 dias', '365 dias', '24 horas'], a: '29,5 dias', e: 'Um mês lunar dura cerca de <b>29,5 dias</b>.' },
  { q: 'Na Lua Cheia, onde está a Lua em relação à Terra e ao Sol?', o: ['Do lado oposto ao Sol', 'Entre a Terra e o Sol', 'Ao lado do Sol', 'Dentro da sombra do Sol'], a: 'Do lado oposto ao Sol', e: 'A Terra fica no meio: vemos a face iluminada inteira.' },
  { q: 'Um eclipse do Sol só pode acontecer na…', o: ['Lua Nova', 'Lua Cheia', 'Quarto Crescente', 'Quarto Minguante'], a: 'Lua Nova', e: 'Na <b>Lua Nova</b> a Lua passa entre a Terra e o Sol.' },
  { q: 'Porque vemos sempre a mesma face da Lua?', o: ['Porque demora o mesmo tempo a rodar sobre si e a dar a volta à Terra', 'Porque a Lua não roda', 'Porque a Terra não roda', 'Porque a outra face é escura'], a: 'Porque demora o mesmo tempo a rodar sobre si e a dar a volta à Terra', e: 'A rotação e a translação da Lua duram o mesmo tempo.' },
  { q: 'No hemisfério Norte, no Quarto Crescente, que lado da Lua está iluminado?', o: ['O direito', 'O esquerdo', 'Nenhum', 'Todo'], a: 'O direito', e: 'A crescer, o lado <b>direito</b> está iluminado. Lembra-te: a Lua é "mentirosa": quando parece um D está a crescer, quando parece um C está a minguar.' },
];
function gen(j) {
  if (j % 2 === 1) return fixed[(j - 1) / 2 % fixed.length];
  const i = K.rand(0, 3);
  return { v: K.svg(200, 200, moonPath(i * CYC / 4 + (i === 0 ? 0.3 : 0), 80, 100, 100), 'style="width:160px"'), q: 'Que fase da Lua é esta? <span class="muted" style="font-size:.7em">(vista do hemisfério Norte)</span>', o: NAMES, a: NAMES[i], keep: true,
    e: i === 0 ? 'Na <b>Lua Nova</b> a face virada para nós não está iluminada.' : i === 2 ? 'Na <b>Lua Cheia</b> vemos a face toda iluminada.' : 'É o <b>' + NAMES[i] + '</b>: metade iluminada, do lado ' + (i === 1 ? 'direito' : 'esquerdo') + '.' };
}
main.append(K.el('div', { class: 'row' }, K.el('button', { class: 'btn primary', onclick: (e) => { e.target.parentNode.remove(); K.quiz(box, { key: 'lua', gen, n: 10 }); box.scrollIntoView({ behavior: 'smooth' }); } }, 'Testar o que aprendi ↓')));
main.append(box);
</script>
</body>
</html>

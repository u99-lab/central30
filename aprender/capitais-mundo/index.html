<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capitais do mundo · Aprende+</title>
<meta name="description" content="Da Lusofonia à Ásia e à Oceânia: 38 capitais para descobrir.">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
const main = K.page({ title: "Capitais do mundo", subject: 'geo', emoji: '🌎', key: 'cmdo', intro: "Algumas capitais não são a maior cidade do país: a da Austrália é <b>Camberra</b> (não Sydney), a do Brasil é <b>Brasília</b> e a do Canadá é <b>Otava</b>." });
const box = K.el('div'); main.append(box);
const P = [["Brasil", "Brasília"], ["Estados Unidos", "Washington"], ["Canadá", "Otava"], ["México", "Cidade do México"], ["Argentina", "Buenos Aires"], ["Chile", "Santiago"], ["Peru", "Lima"], ["Colômbia", "Bogotá"], ["Venezuela", "Caracas"], ["Cuba", "Havana"], ["Angola", "Luanda"], ["Moçambique", "Maputo"], ["Cabo Verde", "Praia"], ["Guiné-Bissau", "Bissau"], ["São Tomé e Príncipe", "São Tomé"], ["Timor-Leste", "Díli"], ["Marrocos", "Rabat"], ["Egito", "Cairo"], ["África do Sul", "Pretória"], ["Nigéria", "Abuja"], ["Quénia", "Nairóbi"], ["Etiópia", "Adis Abeba"], ["China", "Pequim"], ["Japão", "Tóquio"], ["Índia", "Nova Deli"], ["Coreia do Sul", "Seul"], ["Tailândia", "Banguecoque"], ["Vietname", "Hanói"], ["Indonésia", "Jacarta"], ["Filipinas", "Manila"], ["Austrália", "Camberra"], ["Nova Zelândia", "Wellington"], ["Arábia Saudita", "Riade"], ["Irão", "Teerão"], ["Israel", "Jerusalém"], ["Paquistão", "Islamabade"], ["Cazaquistão", "Astana"], ["Mongólia", "Ulan Bator"]];
function gen() {
  const [a, b] = K.one(P), rev = true && Math.random() < .5;
  const pool = P.map(x => rev ? x[0] : x[1]).filter((v, i, s) => s.indexOf(v) === i && v !== (rev ? a : b));
  const ans = rev ? a : b, o = K.shuffle([ans, ...K.pick(pool, 3)]);
  return { q: rev ? '<b>' + b + '</b> é a capital de que país?' : 'Qual é a capital de <b>' + a + '</b>?', o, a: ans, e: 'A capital de ' + a + ' é <b>' + b + '</b>.' };
}
K.quiz(box, { key: 'cmdo', gen, n: 10 });
</script>
</body>
</html>

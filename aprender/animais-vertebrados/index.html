<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classes de vertebrados · Aprende+</title>
<meta name="description" content="Golfinho, pinguim, salamandra, tubarão… a que classe pertence cada animal?">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
const main = K.page({ title: "Classes de vertebrados", subject: 'cie', emoji: '🐸', key: 'avos', intro: "Os vertebrados dividem-se em <b>mamíferos</b>, <b>aves</b>, <b>répteis</b>, <b>anfíbios</b> e <b>peixes</b>. Atenção: o golfinho e a baleia são mamíferos, e o pinguim é uma ave!" });
const box = K.el('div'); main.append(box);
const P = [["Golfinho", "Mamífero"], ["Baleia", "Mamífero"], ["Morcego", "Mamífero"], ["Ornitorrinco", "Mamífero"], ["Pinguim", "Ave"], ["Avestruz", "Ave"], ["Águia", "Ave"], ["Galinha", "Ave"], ["Crocodilo", "Réptil"], ["Cobra", "Réptil"], ["Tartaruga", "Réptil"], ["Lagartixa", "Réptil"], ["Sapo", "Anfíbio"], ["Salamandra", "Anfíbio"], ["Rã", "Anfíbio"], ["Tritão", "Anfíbio"], ["Tubarão", "Peixe"], ["Cavalo-marinho", "Peixe"], ["Sardinha", "Peixe"], ["Raia", "Peixe"]];
function gen() {
  const [a, b] = K.one(P), rev = false && Math.random() < .5;
  const pool = P.map(x => rev ? x[0] : x[1]).filter((v, i, s) => s.indexOf(v) === i && v !== (rev ? a : b));
  const ans = rev ? a : b, o = K.shuffle([ans, ...K.pick(pool, 3)]);
  return { q: rev ? 'A que classe pertence: <b>' + a + '</b>?' : 'A que classe pertence: <b>' + a + '</b>?', o, a: ans, e: '<b>' + a + '</b> é um <b>' + b.toLowerCase() + '</b>.' };
}
K.quiz(box, { key: 'avos', gen, n: 10 });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fenda</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05010d;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#score{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1px;text-shadow:0 0 18px #ff3df0aa}
#mult{position:absolute;top:72px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:#7ff8ff;letter-spacing:2px}
#speed{position:absolute;bottom:18px;right:20px;font:600 13px ui-monospace,monospace;color:#ffffffaa}
#best{position:absolute;bottom:18px;left:20px;font:600 13px ui-monospace,monospace;color:#ffffffaa}
#pop{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:26px;font-weight:800;color:#ffe45c;opacity:0;transition:opacity .25s,transform .25s;text-shadow:0 0 14px #ffb800}
#pop.on{opacity:1;transform:translateY(-12px)}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#0a0218cc,#000e);z-index:5}
.panel[hidden]{display:none}
.card{text-align:center;padding:24px;max-width:min(460px,calc(100vw - 32px))}
.card h1{font-size:64px;margin:0 0 6px;letter-spacing:6px}
.card .sub{color:#c9b8ff;margin:0 0 22px;line-height:1.5}
.card .big{display:inline-block;margin-top:8px;padding:14px 34px;border:0;border-radius:999px;background:linear-gradient(90deg,#ff3df0,#7ff8ff);color:#120320;font-weight:800;font-size:18px;cursor:pointer;pointer-events:auto}
.card .keys{margin-top:20px;font-size:13px;color:#ffffff99;line-height:1.8}
kbd{display:inline-block;padding:1px 7px;border:1px solid #ffffff44;border-radius:5px;font:600 12px ui-monospace,monospace}
.stat{font-size:52px;font-weight:800;margin:4px 0}
.rec{color:#ffe45c;font-weight:800;letter-spacing:2px}
</style>
</head>
<body>
<div id="hud" hidden>
  <div id="score">0</div>
  <div id="mult"></div>
  <div id="pop"></div>
  <div id="best"></div>
  <div id="speed"></div>
</div>
<div class="panel" id="menu">
  <div class="card">
    <h1>FENDA</h1>
    <p class="sub">Um túnel sem fim. Paredes que se fecham.<br>Encontra a fenda e não pares.</p>
    <div id="menuBest" class="sub"></div>
    <button class="big" id="playBtn">Jogar</button>
    <div class="keys"><kbd>←</kbd> <kbd>→</kbd> ou <kbd>A</kbd> <kbd>D</kbd> para rodar · no ecrã toca à esquerda ou à direita<br>Apanha as faíscas seguidas para multiplicar os pontos</div>
  </div>
</div>
<div class="panel" id="over" hidden>
  <div class="card">
    <div class="sub">PONTUAÇÃO</div>
    <div class="stat" id="overScore">0</div>
    <div id="overRec" class="rec"></div>
    <p class="sub" id="overInfo"></p>
    <button class="big" id="againBtn">Outra vez</button>
    <div class="keys"><kbd>ENTER</kbd> ou <kbd>ESPAÇO</kbd> para recomeçar</div>
  </div>
</div>
<div class="panel" id="pause" hidden>
  <div class="card"><h1 style="font-size:40px">PAUSA</h1><button class="big" id="resumeBtn">Continuar</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const R=6,SEG=12,SA=Math.PI*2/SEG,PRAD=R-0.55,PHALF=0.06,TAU=Math.PI*2;
const mod=(a,m)=>((a%m)+m)%m;
const angDiff=(a,b)=>{let d=mod(a-b+Math.PI,TAU)-Math.PI;return d;};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
let best=store.get('fenda.best',0),runs=store.get('fenda.runs',0);

// ---------- som ----------
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch{}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type='sine',v=.15,slide=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
function noise(d,v=.3){const a=audio();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(a.destination);s.start();}

// ---------- cena ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05010d);
scene.fog=new THREE.Fog(0x05010d,25,115);
const camera=new THREE.PerspectiveCamera(78,1,.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?95:78;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// anéis do túnel (sensação de velocidade)
const RIB_N=24,RIB_GAP=6;
const ribGeo=new THREE.BufferGeometry().setFromPoints(Array.from({length:65},(_,i)=>{const a=i/64*TAU;return new THREE.Vector3(Math.sin(a)*R,-Math.cos(a)*R,0);}));
const ribMat=new THREE.LineBasicMaterial({color:0xff3df0,transparent:true,opacity:.55});
const ribs=[];for(let i=0;i<RIB_N;i++){const l=new THREE.Line(ribGeo,ribMat);l.position.z=6-i*RIB_GAP;scene.add(l);ribs.push(l);}
// linhas ao longo do túnel nas fronteiras dos segmentos
const lp=[];for(let k=0;k<SEG;k++){const a=k*SA;const x=Math.sin(a)*R,y=-Math.cos(a)*R;lp.push(new THREE.Vector3(x,y,10),new THREE.Vector3(x,y,-140));}
const railMat=new THREE.LineBasicMaterial({color:0x7ff8ff,transparent:true,opacity:.35});
const rails=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lp),railMat);scene.add(rails);
// parede do túnel
const wall=new THREE.Mesh(new THREE.CylinderGeometry(R+.05,R+.05,160,48,1,true),new THREE.MeshBasicMaterial({color:0x12042a,side:THREE.BackSide}));
wall.rotation.x=Math.PI/2;wall.position.z=-65;scene.add(wall);

// jogador
const player=new THREE.Group();
const core=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),new THREE.MeshBasicMaterial({color:0xffffff}));
const glow=new THREE.Mesh(new THREE.SphereGeometry(.7,20,14),new THREE.MeshBasicMaterial({color:0x7ff8ff,transparent:true,opacity:.28}));
player.add(core,glow);scene.add(player);
const trail=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.3*(1-i/16),10,8),new THREE.MeshBasicMaterial({color:0x7ff8ff,transparent:true,opacity:.35*(1-i/14)}));scene.add(m);trail.push(m);}

// obstáculos
const boxGeo=new THREE.BoxGeometry(TAU*R/SEG*.97,1.7,.9);
const rings=[];
function ringMat(h){return new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(h,1,.55)});}
function edgeMat(h){return new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(h,1,.85)});}
const boxEdges=new THREE.EdgesGeometry(boxGeo);
function buildRing(blocked,h){
  const g=new THREE.Group(),mat=ringMat(h),em=edgeMat(h);
  blocked.forEach((b,k)=>{if(!b)return;const a=k*SA+SA/2,r=R-.85;const m=new THREE.Mesh(boxGeo,mat);m.position.set(Math.sin(a)*r,-Math.cos(a)*r,0);m.rotation.z=a;const e=new THREE.LineSegments(boxEdges,em);m.add(e);g.add(m);});
  scene.add(g);return g;
}
// faíscas
const sparkGeo=new THREE.OctahedronGeometry(.32);
const sparkMat=new THREE.MeshBasicMaterial({color:0xffe45c});
const sparks=[];
// partículas da explosão
const bits=[];const bitGeo=new THREE.BoxGeometry(.18,.18,.18);

// ---------- estado ----------
let state='menu',paused=false,t=0,dist=0,score=0,v=20,ang=0,angV=0,mult=1,chain=0,lastGapC=0,nextZ=-40,shake=0,hue=.85,overAt=0,unl=new Set();
const keys={l:false,r:false};let touchDir=0;

function clearWorld(){for(const r of rings)scene.remove(r.g);rings.length=0;for(const s of sparks)scene.remove(s.m);sparks.length=0;for(const b of bits)scene.remove(b.m);bits.length=0;}
function reset(){clearWorld();t=0;dist=0;score=0;v=20;ang=0;angV=0;mult=1;chain=0;lastGapC=0;nextZ=-60;shake=0;player.visible=true;trail.forEach(m=>m.visible=true);}

function pickPattern(d){
  // devolve {blocked, gapC, spin}
  const r=Math.random(),blocked=Array(SEG).fill(false);
  const gapAt=(c,w)=>{for(let k=0;k<SEG;k++)blocked[k]=true;for(let i=0;i<w;i++)blocked[mod(c+i,SEG)]=false;};
  if(t<.1||d<.15&&r<.5||r<.12){ // poucos blocos, respiro (os primeiros anéis são sempre assim)
    const n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)blocked[Math.floor(Math.random()*SEG)]=true;return{blocked,gapC:null,spin:0};
  }
  if(r<.45){const w=d<.4?3:2;const c=Math.floor(Math.random()*SEG);gapAt(c,w);return{blocked,gapC:(c+w/2)*SA,spin:0};}
  if(r<.62){const w=2;const c=Math.floor(Math.random()*SEG);gapAt(c,w);for(let i=0;i<w;i++)blocked[mod(c+6+i,SEG)]=false;return{blocked,gapC:(c+1)*SA,spin:0,twin:true};}
  if(r<.75){for(let k=0;k<SEG;k++)blocked[k]=(k>>1)%2===0;return{blocked,gapC:null,spin:d>.5?(Math.random()<.5?-1:1)*(.5+d*.4):0};}
  if(r<.87){const c=Math.floor(Math.random()*SEG);for(let i=0;i<6;i++)blocked[mod(c+i,SEG)]=true;return{blocked,gapC:null,spin:0};}
  const w=d<.6?3:2;const c=Math.floor(Math.random()*SEG);gapAt(c,w);return{blocked,gapC:(c+w/2)*SA,spin:(Math.random()<.5?-1:1)*(.45+Math.min(d,1.5)*.5)};
}
function spawnRing(z){
  const d=t/80,p=pickPattern(d);let rot=0;
  if(p.gapC!=null){
    // garante que dá tempo de chegar à fenda
    const gapDist=Math.max(15,v*.82),maxShift=4.2*(gapDist/v)*.7;
    let target=p.gapC,diff=angDiff(target,lastGapC);
    if(Math.abs(diff)>maxShift){rot=angDiff(lastGapC+Math.sign(diff)*maxShift,target);}
    lastGapC=mod(target+rot,TAU);
    // com duas fendas opostas, o próximo anel fica a meio caminho das duas
    if(p.twin)lastGapC=mod(lastGapC+Math.PI/2,TAU);
  }
  hue=mod(.85-t/200,1);
  const g=buildRing(p.blocked,hue);g.position.z=z;g.rotation.z=rot;
  rings.push({g,z,rot,spin:p.spin,blocked:p.blocked,passed:false});
  // faíscas a caminho da fenda
  if(Math.random()<.75){const sa=p.gapC!=null?lastGapC:Math.random()*TAU,sz=z+Math.max(7,v*.4);const m=new THREE.Mesh(sparkGeo,sparkMat);m.position.set(Math.sin(sa)*PRAD,-Math.cos(sa)*PRAD,sz);scene.add(m);sparks.push({m,a:sa,z:sz});}
}
function blockedAt(r,a){const k=Math.floor(mod(a-r.rot,TAU)/SA);return r.blocked[k];}

function pop(text){const p=$('pop');p.textContent=text;p.classList.remove('on');void p.offsetWidth;p.classList.add('on');clearTimeout(pop.t);pop.t=setTimeout(()=>p.classList.remove('on'),700);}
function unlock(id,title){if(unl.has(id))return;unl.add(id);window.C30?.unlock?.(id,title);}

function crash(){
  state='dying';overAt=performance.now();shake=.6;noise(.6,.35);tone(120,.6,'sawtooth',.2,-80);
  player.visible=false;trail.forEach(m=>m.visible=false);
  const pp=player.position;
  for(let i=0;i<46;i++){const m=new THREE.Mesh(bitGeo,new THREE.MeshBasicMaterial({color:i%2?0x7ff8ff:0xffffff}));m.position.copy(pp);scene.add(m);bits.push({m,v:new THREE.Vector3((Math.random()-.5)*14,(Math.random()-.5)*14,(Math.random()-.2)*12),life:1});}
}
function gameOver(){
  state='over';runs++;store.set('fenda.runs',runs);
  const s=Math.floor(score),rec=s>best;if(rec){best=s;store.set('fenda.best',best);}
  $('overScore').textContent=s.toLocaleString('pt-PT');
  $('overRec').textContent=rec?'NOVO RECORDE!':'';
  $('overInfo').innerHTML=`Recorde: ${best.toLocaleString('pt-PT')} · ${Math.round(dist)} m · ${Math.round(v*3.6)} km/h no fim`;
  $('hud').hidden=true;$('over').hidden=false;
}
function start(){audio();reset();state='play';paused=false;$('menu').hidden=true;$('over').hidden=true;$('pause').hidden=true;$('hud').hidden=false;$('best').textContent='RECORDE '+best.toLocaleString('pt-PT');tone(440,.12,'triangle',.12,440);}

// ---------- ciclo ----------
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(paused)dt=0;
  if(state==='play')update(dt);
  else if(state==='dying'){updateBits(dt);moveWorld(dt*.25);if(now-overAt>900)gameOver();}
  else if(state==='menu'||state==='over'){moveWorld(dt*.4);ang+=dt*.25;}
  // câmara
  const dx=Math.sin(ang),dy=-Math.cos(ang);
  player.position.set(dx*PRAD,dy*PRAD,0);
  for(let i=trail.length-1;i>0;i--)trail[i].position.copy(trail[i-1].position).setZ(trail[i-1].position.z+.35*(v/20));
  trail[0].position.copy(player.position).setZ(.35);
  camera.position.set(dx*2.2,dy*2.2,7.5);
  camera.up.set(-dx,-dy,0); // o jogador fica sempre em baixo no ecrã
  camera.lookAt(dx*.6,dy*.6,-25);
  if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.2);}
  const c=new THREE.Color().setHSL(hue,1,.55);ribMat.color.copy(c);
  glow.scale.setScalar(1+Math.sin(now/120)*.08);
  for(const s of sparks){s.m.rotation.y+=dt*4;s.m.rotation.x+=dt*2;}
  renderer.render(scene,camera);
}
function moveWorld(dt){
  const dz=v*dt;
  for(const r of ribs){r.position.z+=dz;if(r.position.z>8)r.position.z-=RIB_N*RIB_GAP;}
  for(const r of rings){r.z+=dz;r.rot+=r.spin*dt;r.g.position.z=r.z;r.g.rotation.z=r.rot;}
  for(const s of sparks){s.z+=dz;s.m.position.z=s.z;}
  while(rings.length&&rings[0].z>12){scene.remove(rings[0].g);rings.shift();}
  for(let i=sparks.length-1;i>=0;i--)if(sparks[i].z>10){scene.remove(sparks[i].m);sparks.splice(i,1);}
  if(state==='menu'||state==='over'){nextZ+=dz;while(nextZ>-115){spawnRing(nextZ-0);nextZ-=26;}}
}
function updateBits(dt){for(let i=bits.length-1;i>=0;i--){const b=bits[i];b.v.multiplyScalar(1-dt*1.5);b.m.position.addScaledVector(b.v,dt);b.m.rotation.x+=dt*8;b.life-=dt*.9;b.m.scale.setScalar(Math.max(.01,b.life));if(b.life<=0){scene.remove(b.m);bits.splice(i,1);}}}
function update(dt){
  t+=dt;v=Math.min(58,20+t*.55);
  const dir=(keys.r?1:0)-(keys.l?1:0)+touchDir;
  const w=4.2+Math.min(1.2,t*.01);
  angV+=(Math.max(-1,Math.min(1,dir))*w-angV)*Math.min(1,dt*14);
  ang=mod(ang+angV*dt,TAU);
  const dz=v*dt;dist+=dz;score+=dz*(.5+mult*.5);
  nextZ+=dz;
  const gap=Math.max(15,v*.82);
  while(nextZ>-120){spawnRing(nextZ);nextZ-=gap;}
  moveWorld(dt);
  // colisões
  for(const r of rings){
    if(Math.abs(r.z)<.45+.42){
      if(blockedAt(r,ang-PHALF)||blockedAt(r,ang+PHALF)){crash();return;}
    }
    if(!r.passed&&r.z>.9){
      r.passed=true;
      // por um triz: bloco mesmo ao lado
      if(blockedAt(r,ang-.2)||blockedAt(r,ang+.2)){score+=25*mult;pop('Por um triz! +'+25*mult);tone(900,.15,'triangle',.08,500);}
    }
  }
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];
    if(Math.abs(s.z)<.8&&Math.abs(angDiff(s.a,ang))<.28){
      chain++;mult=Math.min(8,1+Math.floor(chain/3));score+=10*mult;tone(600+chain*25,.1,'square',.06);scene.remove(s.m);sparks.splice(i,1);
      if(chain===12)pop('Combo x'+mult+'!');
    }else if(s.z>1.2&&!s.missed){s.missed=true;if(chain>0){chain=0;mult=1;tone(200,.15,'sine',.06,-80);}}
  }
  const sc=Math.floor(score);$('score').textContent=sc.toLocaleString('pt-PT');
  $('mult').textContent=mult>1?'COMBO x'+mult:'';
  $('speed').textContent=Math.round(v*3.6)+' km/h';
  if(sc>=1000)unlock('fenda-1000','Fenda: passaste os 1000 pontos');
  if(sc>=5000)unlock('fenda-5000','Fenda: 5000 pontos!');
  if(mult>=8)unlock('fenda-combo','Fenda: combo máximo x8');
}
requestAnimationFrame(frame);

// ---------- entrada ----------
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;
  if((e.code==='Enter'||e.code==='Space')&&!e.repeat){e.preventDefault();if(state==='menu'||(state==='over'&&performance.now()-overAt>1300))start();else if(paused)setPause(false);}
  if(e.code==='KeyP')setPause(!paused);
});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;});
const touches=new Map();
function updTouch(){let d=0;for(const x of touches.values())d+=x<innerWidth/2?-1:1;touchDir=Math.max(-1,Math.min(1,d));}
renderer.domElement.addEventListener('pointerdown',e=>{touches.set(e.pointerId,e.clientX);updTouch();});
addEventListener('pointermove',e=>{if(touches.has(e.pointerId)){touches.set(e.pointerId,e.clientX);updTouch();}});
addEventListener('pointerup',e=>{touches.delete(e.pointerId);updTouch();});
addEventListener('pointercancel',e=>{touches.delete(e.pointerId);updTouch();});
$('playBtn').onclick=start;$('againBtn').onclick=start;$('resumeBtn').onclick=()=>setPause(false);

// ---------- pausa (ESC na Central 30) ----------
function setPause(p){if(state!=='play'){paused=false;return;}paused=p;$('pause').hidden=!p;if(p){keys.l=keys.r=false;touches.clear();touchDir=0;}}
window.C30pause=force=>setPause(force===true?true:force===false?false:!paused);
window.C30isPaused=()=>paused;
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);});
addEventListener('blur',()=>{keys.l=keys.r=false;});

$('menuBest').textContent=best?'Recorde: '+best.toLocaleString('pt-PT'):'';
// fundo animado no menu
for(let z=-30;z>-115;z-=26)spawnRing(z);nextZ=-115;
</script>
</body>
</html>

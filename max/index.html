<style>
:root{--bg:#0e0a2a;--panel:#1b1550;--panel2:#261d6b;--ink:#fff;--mute:#b9b4e0;--yel:#ffe14a;--pink:#ff3d8b;--cy:#3de0ff;--line:#ffffff26;--acc:#ffe14a;
 --disp:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Rubik","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
html.c30playing{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px;border-radius:10px}
h1,h2,h3,p{margin:0}
kbd{font:700 11px/1 var(--body);background:#ffffff1f;border:1px solid #ffffff40;border-bottom-width:3px;border-radius:7px;padding:4px 7px;white-space:nowrap}
/* fundo vivo */
#bd{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(60vw 50vh at 85% -5%,#ff3d8b55,transparent 70%),radial-gradient(55vw 55vh at -5% 30%,#3de0ff33,transparent 70%),linear-gradient(180deg,#1a1156,#0e0a2a 60%)}
#bd i{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(46px) saturate(1.5);opacity:0;transition:opacity .9s}
#bd i.on{opacity:.34}
#bd:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0e0a2a33,#0e0a2ae6 62%,#0e0a2a)}
/* topo */
.rail{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px clamp(14px,3.4vw,44px);background:linear-gradient(180deg,#0e0a2af2,#0e0a2a99 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--disp);letter-spacing:-.5px;white-space:nowrap}
.brand b{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--pink),#ff8a3d);font-size:17px;box-shadow:0 6px 20px #ff3d8b66;transition:transform .25s}
.brand:hover b{transform:rotate(-8deg) scale(1.08)}
.brand i{font-style:normal;font-size:10px;letter-spacing:1px;background:var(--yel);color:#17104a;padding:4px 7px;border-radius:6px}
.nav{display:flex;gap:4px;margin-left:10px;background:#ffffff12;border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute)}
.nav button:hover{color:#fff;background:#ffffff14}
.nav button.active{background:#fff;color:#17104a}
.top-right{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;min-width:0}
#playTime{font-weight:700;font-size:12px;padding:8px 12px;border-radius:999px;background:#ffffff12;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.keep-chip{background:#ffffff14;border:1px solid var(--line);color:#fff;padding:8px 13px;border-radius:999px;font:600 13px/1.2 var(--body)}
.keep-chip:hover{background:#ffffff26}
.keep-chip.on{border-color:#7be36b88}
.main{max-width:1500px;margin:0 auto;padding:6px clamp(14px,3.4vw,44px) 50px}
/* destaque */
.spot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,56px);align-items:center;min-height:min(58vh,560px);padding:10px 0 26px}
.spot-txt{min-width:0;animation:in .45s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.b{font:700 11px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;padding:7px 10px;border-radius:8px;background:#ffffff1c;border:1px solid var(--line)}
.b.new{background:var(--yel);border-color:var(--yel);color:#17104a}
.b.acc{background:var(--acc);border-color:var(--acc);color:#17104a}
.spot h1{font:800 clamp(34px,5.2vw,74px)/.98 var(--disp);letter-spacing:-.04em;text-wrap:balance;text-shadow:0 6px 40px #0008}
.kick{margin:14px 0 10px;font:700 12px/1.3 var(--body);letter-spacing:2.4px;color:var(--acc)}
.desc{color:#dcd9f5;font-size:16px;max-width:56ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.keys{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;font-size:13px;color:var(--mute)}
.keys span{display:flex;align-items:center;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.cta{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:16px;background:var(--yel);color:#17104a;font:800 17px/1 var(--disp);box-shadow:0 8px 0 #b89a00,0 16px 40px #ffe14a55;transition:transform .1s,box-shadow .1s}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 0 #b89a00,0 20px 46px #ffe14a77}
.cta:active{transform:translateY(6px);box-shadow:0 2px 0 #b89a00}
.pill,.ghost{display:inline-flex;align-items:center;gap:8px;padding:0 18px;min-height:52px;border-radius:16px;background:#ffffff17;border:1px solid var(--line);font-weight:700;font-size:15px}
.pill:hover,.ghost:hover{background:#ffffff2b}
.pill.on{background:var(--pink);border-color:var(--pink)}
.dots{display:flex;gap:6px;margin-top:26px}
.dots button{width:26px;height:6px;border-radius:9px;background:#ffffff33;transition:.3s}
.dots button.on{background:#fff;width:44px}
.spot-art{position:relative;aspect-ratio:16/10;border-radius:26px;overflow:hidden;transform:perspective(1300px) rotateY(-7deg) rotateX(2deg);box-shadow:0 0 0 3px #ffffff2e,0 30px 90px #000a,0 0 110px color-mix(in srgb,var(--acc) 50%,transparent);cursor:pointer;transition:transform .5s;background:var(--panel)}
.spot-art:hover{transform:perspective(1300px) rotateY(-2deg) scale(1.015)}
.spot-art img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom .9s cubic-bezier(.2,.9,.3,1)}
@keyframes zoom{from{transform:scale(1.12);opacity:.3}}
.spot-art:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff26,transparent 30%)}
.spot-art .num{position:absolute;left:16px;bottom:14px;z-index:1;font:800 13px/1 var(--disp);background:#0e0a2acc;padding:8px 11px;border-radius:10px}
.spot-art .playbig{position:absolute;right:16px;bottom:14px;z-index:1;width:58px;height:58px;border-radius:50%;background:var(--yel);color:#17104a;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 30px #0008}
/* barra de filtros */
.bar{position:sticky;top:66px;z-index:4;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 12px;margin:0 -12px 6px;border-radius:20px;background:#140e3fd9;backdrop-filter:blur(14px);border:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip,.tab{flex:none;padding:9px 15px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute);background:#ffffff0f;border:1px solid transparent;white-space:nowrap}
.chip:hover,.tab:hover{color:#fff;background:#ffffff1f}
.chip.on,.tab.active{background:#fff;color:#17104a}
.tab small{font-size:11px;opacity:.7;margin-left:3px}
.tools{display:flex;gap:8px;align-items:center}
#search,#sort,.dialog select{height:42px;border-radius:999px;border:1px solid var(--line);background:#ffffff14;padding:0 16px;font-weight:500;font-size:14px;max-width:100%}
#search{width:200px}#search::placeholder{color:#b9b4e0aa}
#sort option,.dialog select option{background:#1b1550;color:#fff}
/* prateleiras */
.shelf{margin-top:26px;position:relative}
.shelf h2{font:800 clamp(17px,2vw,23px)/1.1 var(--disp);letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.shelf h2 small{font:600 12px var(--body);color:var(--mute);letter-spacing:.5px}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 6px 22px;margin:0 -6px;scrollbar-width:none;scroll-behavior:smooth}
.row::-webkit-scrollbar{display:none}
.row.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));overflow:visible}
.tile{position:relative;flex:none;width:clamp(200px,21vw,290px);aspect-ratio:16/10;border-radius:18px;overflow:hidden;cursor:pointer;scroll-snap-align:start;background:var(--panel);box-shadow:0 0 0 2px #ffffff1c;transition:transform .22s cubic-bezier(.2,1.4,.4,1),box-shadow .22s}
.row.grid .tile{width:auto}
.tile.big{width:clamp(250px,27vw,380px)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0b0726e6);pointer-events:none}
.tile:hover,.tile:focus-visible,.tile.sel{transform:translateY(-6px) scale(1.035);box-shadow:0 0 0 3px var(--accent,#fff),0 18px 44px #000a,0 0 46px color-mix(in srgb,var(--accent,#fff) 55%,transparent);z-index:2;outline:0}
.tile:hover img,.tile:focus-visible img{transform:scale(1.07)}
.tile-b{position:absolute;left:14px;right:14px;bottom:11px;z-index:1}
.tile h3{font:800 16px/1.1 var(--disp);letter-spacing:-.02em;text-shadow:0 2px 10px #000a}
.tile-b span{display:block;margin-top:5px;font-size:12px;font-weight:600;color:#d5d1f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tag{position:absolute;left:10px;top:10px;z-index:1;font:800 10px/1 var(--body);letter-spacing:1px;padding:6px 8px;border-radius:7px;background:var(--yel);color:#17104a}
.tile .tag.last{background:var(--pink);color:#fff}
.fav{position:absolute;right:9px;top:9px;z-index:2;width:36px;height:36px;border-radius:50%;background:#0e0a2a99;display:grid;place-items:center;opacity:0;transition:.2s}
.fav svg{width:17px;height:17px}
.tile:hover .fav,.tile:focus-within .fav,.fav.on{opacity:1}
.fav.on{background:var(--pink)}.fav.on svg{fill:#fff}
.go{position:absolute;right:12px;bottom:12px;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--yel);color:#17104a;display:grid;place-items:center;font-size:15px;opacity:0;transform:scale(.6);transition:.2s}
.tile:hover .go,.tile:focus-visible .go{opacity:1;transform:none}
.tile:hover .tile-b,.tile:focus-visible .tile-b{right:60px}
.sh-btn{position:absolute;top:calc(50% + 8px);z-index:3;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#fff;color:#17104a;display:grid;place-items:center;box-shadow:0 8px 26px #0009;opacity:0;transition:.2s}
.shelf:hover .sh-btn{opacity:1}.sh-btn.l{left:-14px}.sh-btn.r{right:-14px}
#gameGrid .c30-live{top:auto;bottom:auto;left:10px;top:42px}
.empty-state{padding:60px 20px;text-align:center;border:2px dashed var(--line);border-radius:20px;color:var(--mute);font-weight:600;margin-top:26px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.foot strong{color:#fff}
.foot-right{display:flex;align-items:center;gap:16px;font-weight:700;font-size:11px;letter-spacing:1px}
#controlsLink{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:0;color:#fff}
/* jogo */
.play-view{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
.play-bar{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:linear-gradient(90deg,#1b1550,#2a1b70);border-bottom:2px solid var(--pink)}
.bar-left,.bar-actions{display:flex;align-items:center;gap:8px;min-width:0}
.back{display:flex;align-items:center;gap:7px;padding:8px 14px 8px 10px;border-radius:999px;background:#fff;color:#17104a;font-weight:700;font-size:13px}
.bar-divider{width:1px;height:20px;background:#ffffff40}
.playing-title{font:800 15px/1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-label{font:800 10px/1 var(--body);letter-spacing:1.4px;padding:5px 7px;border-radius:6px;background:var(--pink);white-space:nowrap}
.session-time{font-weight:700;font-size:13px;padding:0 6px;font-variant-numeric:tabular-nums}
.bar-actions>button:not(.keep-chip){display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;font-weight:600;font-size:13px}
.bar-actions>button:not(.keep-chip):hover{background:#ffffff24}
.game-frame{flex:1;min-height:0;width:100%;border:0;background:#000;display:block}
#pausedBadge{position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:14;background:var(--yel);color:#17104a;padding:10px 20px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:0 10px 30px #0008}
#c30barTog{display:none}
.loader{position:absolute;inset:52px 0 0;z-index:12;background:radial-gradient(60vw 60vh at 50% 40%,#3a2596,#0e0a2a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.loader-mark{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--pink),#ff8a3d);display:grid;place-items:center;font:800 36px/1 var(--disp);box-shadow:0 20px 60px #ff3d8b88;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:rotate(-8deg) scale(.94)}to{transform:rotate(6deg) scale(1.06)}}
.loading-line{width:min(260px,60vw);height:8px;border-radius:99px;overflow:hidden;position:relative;background:#ffffff26}
.loading-line:after{content:"";position:absolute;inset:0;width:40%;background:var(--yel);border-radius:99px;animation:vai 1s ease-in-out infinite alternate}
@keyframes vai{from{left:0}to{left:60%}}
.loader p{font:800 12px/1.4 var(--disp);letter-spacing:1px;text-align:center;padding:0 20px}
html:not(.c30playing) #c30chat{top:calc(74px + env(safe-area-inset-top,0px))}
@media (max-width:700px),(max-height:520px),(pointer:coarse){
 .play-view .play-bar{position:absolute;left:0;right:0;top:0;z-index:13;transform:translateY(-100%);transition:transform .25s}
 .play-view.c30bar .play-bar{transform:none}.loader{inset:0}
 #c30barTog{display:block;position:absolute;z-index:14;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);background:#1b1550e6;color:#fff;border:1px solid #ffffff55;border-top:0;border-radius:0 0 12px 12px;padding:2px 16px 5px;font:800 14px/1 var(--body)}
 .play-view.c30bar #c30barTog{top:calc(env(safe-area-inset-top,0px) + 52px)}
 .button-label,.live-label,.bar-divider{display:none}
}
/* diálogos */
.dialog{width:min(620px,calc(100vw - 24px));max-height:min(88vh,780px);padding:0;border:1px solid #ffffff3d;border-radius:26px;background:linear-gradient(180deg,#2a1f78,#1b1550);color:#fff;box-shadow:0 40px 120px #000c;overflow:hidden}
.dialog[open]{display:flex;flex-direction:column;animation:in .3s cubic-bezier(.2,.9,.3,1)}
.dialog::backdrop{background:#080520c7;backdrop-filter:blur(6px)}
.dialog-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 14px}
.dialog-header h2{font:800 24px/1.05 var(--disp);letter-spacing:-.03em}
.close{flex:none;width:38px;height:38px;border-radius:50%;background:#ffffff1f;font-size:20px;font-weight:700}
.close:hover{background:var(--pink)}
.dialog-body{padding:4px 22px 24px;overflow-y:auto}
.dialog-body>p{margin-bottom:14px;color:#dcd9f5}
.control-row{display:grid;grid-template-columns:minmax(100px,auto) 1fr;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff1a}
.control-row kbd{justify-self:start;white-space:normal}
.tip{margin-top:16px;padding:14px 16px;border-radius:16px;background:#ffe14a1a;border:1px solid #ffe14a55;font-size:14px;color:#fff6c9}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #ffffff1a}
.setting label{font-weight:700;display:block}
.setting small{color:var(--mute);font-size:13px}
.setting input[type=range]{accent-color:var(--yel);width:150px;max-width:40vw}
.setting input[type=checkbox]{width:22px;height:22px;accent-color:var(--yel)}
.setting .ghost{min-height:40px;padding:0 14px;font-size:13px;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:#ffffff14;border-radius:999px;padding:4px;flex:none}
.seg-btn{padding:8px 16px;font-weight:700;font-size:14px;border-radius:999px}
.seg-btn.on{background:#fff;color:#17104a}
.setting-note{margin-top:14px;font-size:12.5px;color:var(--mute)}
.discoveries{display:grid;gap:8px}
.discovery{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#ffffff12}
.discovery-icon{width:36px;height:36px;flex:none;border-radius:12px;background:var(--yel);color:#17104a;display:grid;place-items:center}
.discovery small{display:block;color:var(--mute);font-size:12px}
.empty{padding:26px 16px;text-align:center;border:2px dashed var(--line);border-radius:16px;color:var(--mute)}
.bar-row{display:grid;grid-template-columns:minmax(0,160px) 1fr 62px;gap:10px;align-items:center;padding:5px 0;font-size:13px;font-weight:600}
.bar-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row i{height:10px;border-radius:99px;background:#ffffff1a;position:relative;overflow:hidden}
.bar-row i:after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent);border-radius:99px}
.bar-row em{font-style:normal;font-size:12px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.statgrid div{background:#ffffff12;border-radius:16px;padding:14px;text-align:center}
.statgrid b{display:block;font:800 22px/1.1 var(--disp)}.statgrid span{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:2147482500;transform:translate(-50%,30px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);padding:13px 20px;border-radius:999px;background:#fff;color:#17104a;font-weight:700;font-size:14px;box-shadow:0 14px 50px #000a;transition:.3s cubic-bezier(.2,1.5,.4,1)}

os de todos os jogos? Não dá para desfazer.'))return;try{const del=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith('c30.')||k.startsWith('craques3d.')||/^(vfig|patrao|jdc)\./.test(k)||k==='central30.aviso')&&!['c30.settings','c30.reset','c30.ipadFix','c30.pass','c30.pass2','c30.passN','c30.trialN'].includes(k)&&!k.startsWith('c30.gpass.'))del.push(k);}del.forEach(k=>localStorage.removeItem(k));sessionStorage.setItem('c30.wiped','1');}catch{}location.reload();};$('keepYes').onclick=()=>setKeep(true);$('keepNo').onclick=()=>setKeep(false);paintKeep();}

// ---------- cliente MQTT mínimo (MQTT 3.1.1 sobre WebSocket, QoS 0) ----------
function mqttConn(url,o){
 const enc=new TextEncoder(),dec=new TextDecoder();
 let ws=null,up=false,buf=new Uint8Array(0),ping=null,retry=1500,closed=false;
 const str=s=>{const b=enc.encode(s);return [b.length>>8,b.length&255,...b];};
 const len=n=>{const out=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;out.push(d);}while(n>0);return out;};
 const pkt=(h,body)=>new Uint8Array([h,...len(body.length),...body]);
 const send=p=>{try{if(ws&&ws.readyState===1)ws.send(p);}catch{}};
 function open(){
  if(closed)return;
  try{ws=new WebSocket(url,'mqtt');}catch{return later();}
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{
   const will=o.will?[...str(o.will.topic),...str(o.will.payload)]:[];
   const flags=0x02|(o.will?0x04:0);
   send(pkt(0x10,[...str('MQTT'),4,flags,0,40,...str(o.clientId),...will]));
  };
  ws.onmessage=e=>{const d=new Uint8Array(e.data);const nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;parse();};
  ws.onclose=()=>{const was=up;up=false;clearInterval(ping);ws=null;if(was)o.onDown&&o.onDown();later();};
  ws.onerror=()=>{try{ws&&ws.close();}catch{}};
 }
 function later(){if(closed)return;setTimeout(open,retry);retry=Math.min(retry*2,30000);}
 function parse(){
  for(;;){
   if(buf.length<2)return;
   let mul=1,n=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];n+=(b&127)*mul;mul*=128;if(i>5){try{ws.close();}catch{}return;}}while(b&128);
   if(buf.length<i+n)return;
   const h=buf[0],type=h>>4,body=buf.slice(i,i+n);buf=buf.slice(i+n);
   if(type===2){if(body[1]===0){up=true;retry=1500;let pid=1;for(const t of o.subs)send(pkt(0x82,[0,pid++,...str(t),0]));clearInterval(ping);ping=setInterval(()=>send(new Uint8Array([0xC0,0])),20000);o.onUp&&o.onUp();}else{closed=true;try{ws.close();}catch{}}}
   else if(type===3){const tl=(body[0]<<8)|body[1];const topic=dec.decode(body.subarray(2,2+tl));let off=2+tl;if((h>>1)&3)off+=2;try{o.onMsg&&o.onMsg(topic,body.subarray(off));}catch{}}
  }
 }
 open();
 return {
  up:()=>up,
  pub:(topic,data)=>{if(!up)return;const p=enc.encode(typeof data==='string'?data:JSON.stringify(data));send(pkt(0x30,[...str(topic),...p]));},
  end:()=>{closed=true;try{send(new Uint8Array([0xE0,0]));ws&&ws.close();}catch{}}
 };
}
// ligação a vários servidores ao mesmo tempo: se um falhar, os outros continuam (as mensagens repetidas são ignoradas)
const mq=(()=>{
 let conns=[],seen=new Map();
 const handlers={};
 return {
  start(subs){
   const will={topic:TOPIC+'/p',payload:JSON.stringify({id:myId,bye:1})};
   conns=BROKERS.map(u=>mqttConn(u,{clientId:'c30-'+myId+'-'+rid(3),subs,will,
    onUp:()=>handlers.up&&handlers.up(),
    onMsg:(topic,payload)=>{if(payload.length>3000)return;let m;try{m=JSON.parse(new TextDecoder().decode(payload));}catch{return;}if(!m||typeof m!=='object')return;
     if(m.mid){if(seen.has(m.mid))return;seen.set(m.mid,Date.now());if(seen.size>500){const old=Date.now()-120000;for(const [k,t] of seen)if(t<old)seen.delete(k);}}
     handlers.msg&&handlers.msg(topic,m);}
   }));
  },
  on(k,f){handlers[k]=f;},
  up:()=>conns.some(c=>c.up()),
  pub(topic,data){if(!data.mid)data.mid=rid(8);for(const c of conns)c.pub(topic,data);},
  end(){for(const c of conns)c.end();}
 };
})();

  if(topic===TOPIC+'/p'){
   if(typeof m.id!=='string'||m.id===myId||m.id.length>20)return;

 setInterval(refreshCounts,3000);

}

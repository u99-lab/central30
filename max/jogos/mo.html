<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Motocross das Dunas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;color:#fff;font:600 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#k-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.k-tc{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
.k-bc{bottom:18px;left:50%;transform:translateX(-50%)}.k-bl{bottom:18px;left:14px}.k-br{bottom:18px;right:14px}

.k-pill b{font-size:20px}

.k-meter{width:min(280px,60vw);height:20px;border-radius:999px;border:3px solid #fff;background:#0b1020aa;overflow:hidden;position:relative}

#k-flash{position:fixed;left:0;right:0;top:26%;text-align:center;z-index:3;pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .2s,transform .35s cubic-bezier(.2,1.7,.4,1)}

#k-flash b{display:block;font:900 clamp(40px,9vw,96px)/1 system-ui,sans-serif;letter-spacing:-.03em;color:var(--fc,#fff);text-shadow:0 5px 0 #0b1020,0 0 40px #0008;-webkit-text-stroke:2px #0b1020}

.k-title em{font-style:normal;color:var(--kc,#ffd23f)}
.k-lead{color:#b9c2e6;font-weight:600;margin-bottom:18px}
.k-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.k-lab{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#8f9bd0;margin-top:14px}
.k-go,.k-alt,.k-chip{font:800 16px/1 system-ui,sans-serif;color:#fff;border:0;cursor:pointer;border-radius:14px;padding:14px 20px;touch-action:manipulation}
.k-go{display:block;width:100%;margin-top:14px;background:var(--kc,#ffd23f);color:#0b1020;font-size:19px;padding:17px;box-shadow:0 5px 0 #0006;transition:transform .08s}
.k-go:active{transform:translateY(4px);box-shadow:none}
.k-alt{display:block;width:100%;margin-top:10px;background:#ffffff14;border:2px solid #ffffff2a}
.k-alt:hover{background:#ffffff24}
.k-chip{background:#ffffff12;border:2px solid #ffffff26;padding:10px 14px;font-size:14px}
.k-chip.on{background:var(--kc,#ffd23f);border-color:var(--kc,#ffd23f);color:#0b1020}
.k-chip:disabled{opacity:.4;cursor:default}
.k-chip small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-top:4px}

.k-tab td{padding:6px 8px;border-bottom:1px solid #ffffff1a;text-align:left}.k-tab td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.k-tab tr.me td{color:var(--kc,#ffd23f)}
.k-keys{margin-top:16px;font-size:12.5px;color:#9aa6d6;font-weight:600;line-height:1.7}
.k-keys kbd{font:800 11px system-ui;background:#ffffff1c;border:1px solid #ffffff33;border-bottom-width:3px;border-radius:6px;padding:2px 6px;color:#fff;margin:0 2px}
#k-toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);z-index:4;opacity:0;pointer-events:none;background:#0b1020e6;border:2px solid #ffffff33;border-radius:999px;padding:9px 18px;font-weight:800;transition:.25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#k-toast.on{opacity:1;transform:translate(-50%,0)}
#k-pad{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
#k-pad.on{display:block}
#k-stick{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff14;display:none;margin:-60px 0 0 -60px}
#k-stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#ffffffcc}
#k-btns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:12px;max-width:190px;pointer-events:auto}

#k-btns button.dn{background:#ffd23f;color:#0b1020}
#k-pbtn{position:fixed;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:44px;height:44px;border-radius:12px;border:2px solid #ffffff44;background:#0b1020aa;color:#fff;font:900 16px system-ui;display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Kit comum dos jogos novos da Central 30 MAX (motor, comandos, som, menus).
(()=>{'use strict';
const K=window.K={time:0,paused:false,inGame:false,shake:0};

K.sfx={click:()=>K.tone(660,.06,'square',.06),kick:()=>{K.tone(140,.14,'sine',.4,50);K.noise(.07,.2,900);},bounce:(v=1)=>K.tone(190,.09,'sine',.22*v,90),hit:()=>{K.noise(.12,.3,500);K.tone(110,.12,'triangle',.25,50);},
 coin:()=>{K.tone(988,.07,'square',.07);K.tone(1319,.14,'square',.07,0,.07);},good:()=>[523,659,784].forEach((f,i)=>K.tone(f,.14,'triangle',.14,0,i*.08)),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>K.tone(f,.2,'triangle',.15,0,i*.12)),
 bad:()=>{K.tone(220,.25,'sawtooth',.1,110);K.tone(160,.3,'sawtooth',.09,80,.15);},whistle:(long)=>{K.tone(2350,long?.7:.25,'square',.05);K.tone(2500,long?.7:.25,'sine',.07);},
 cheer:(v=1)=>{K.noise(1.6,.16*v,1400,0,.4);K.noise(1.2,.1*v,2600,.1,.6);},ooh:()=>K.noise(.8,.1,700,0,.5),whoosh:()=>K.noise(.25,.14,1800,0,1.5),boost:()=>{K.tone(200,.5,'sawtooth',.09,900);K.noise(.4,.1,3000);},tick:()=>K.tone(880,.05,'square',.07),horn:()=>K.tone(392,.5,'square',.08)};

let scrH={};
K.screen=(html,handlers)=>{const s=$('k-screen');if(html==null){s.hidden=true;s.innerHTML='';return;}scrH=handlers||{};s.innerHTML='<div class="k-box">'+html+'</div>';s.hidden=false;s.scrollTop=0;};

let flT=0;K.flash=(text,sub='',ms=1500,color='#fff')=>{const f=$('k-flash');f.style.setProperty('--fc',color);f.innerHTML='<b>'+text+'</b>'+(sub?'<span>'+sub+'</span>':'');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');clearTimeout(flT);flT=setTimeout(()=>f.classList.remove('on'),ms);};

K.keysHelp=rows=>'<div class="k-keys">'+rows.map(r=>r[0].split(' ').map(k=>'<kbd>'+k+'</kbd>').join('')+' '+r[1]).join(' &nbsp;·&nbsp; ')+'</div>';
// ---------- 3D
const mats=new Map();
K.mat=(c,o)=>{if(c&&c.isMaterial)return c;const k=c+(o?JSON.stringify(o):'');let m=mats.get(k);if(!m){m=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));mats.set(k,m);}return m;};

K.box=(w,h,d,c,x,y,z,p)=>K.mesh(G('b'+w+','+h+','+d,()=>new THREE.BoxGeometry(w,h,d)),c,x,y,z,p);
K.cyl=(rt,rb,h,c,x,y,z,p,seg=16)=>K.mesh(G('c'+rt+','+rb+','+h+','+seg,()=>new THREE.CylinderGeometry(rt,rb,h,seg)),c,x,y,z,p);
K.sph=(r,c,x,y,z,p,seg=18)=>K.mesh(G('s'+r+','+seg,()=>new THREE.SphereGeometry(r,seg,Math.max(8,seg*.7|0))),c,x,y,z,p);

K.tex=(w,h,draw,rep)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;};
K.init=(o={})=>{const r=K.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.domElement.id='k-canvas';document.body.prepend(r.domElement);
 const s=K.scene=new THREE.Scene(),sky=o.sky===undefined?0x8fd3ff:o.sky;s.background=new THREE.Color(sky);if(o.fog)s.fog=new THREE.Fog(o.fogColor===undefined?sky:o.fogColor,o.fog[0],o.fog[1]);

// o sol segue um ponto (para sombras em mundos grandes)
K.sunFollow=(x,z)=>{const o=K.sun.userData.off||(K.sun.userData.off=K.sun.position.clone());K.sun.position.set(x+o.x,o.y,z+o.z);K.sun.target.position.set(x,0,z);};
K.person=(o={})=>{const g=new THREE.Group(),skin=o.skin||0xf0c8a0,shirt=o.shirt||0xe8452c,shorts=o.shorts||0x22305a,hair=o.hair||0x3a2a1c,P={};
 P.torso=K.box(.52,.62,.28,shirt,0,1.08,0,g);K.box(.54,.22,.3,shorts,0,.72,0,g);
 P.head=K.box(.36,.36,.36,skin,0,1.6,0,g);K.box(.38,.13,.38,hair,0,1.79,0,g);K.box(.38,.2,.1,hair,0,1.68,-.15,g);
 for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.14,.66,0);g.add(leg);K.box(.19,.5,.21,o.legs||skin,0,-.25,0,leg);K.box(.19,.16,.21,o.socks||0xffffff,0,-.5,0,leg);K.box(.2,.12,.32,o.shoes||0x222222,0,-.62,.05,leg);P[s<0?'legL':'legR']=leg;
  const arm=new THREE.Group();arm.position.set(s*.34,1.34,0);g.add(arm);K.box(.15,.26,.17,shirt,0,-.1,0,arm);K.box(.13,.4,.15,o.gloves||skin,0,-.42,0,arm);P[s<0?'armL':'armR']=arm;}
 g.userData.P=P;(o.parent||K.scene).add(g);if(o.s)g.scale.setScalar(o.s);return g;};

<script>
// TITLE: Motocross das Dunas

(()=>{'use strict';

const scene=K.scene,cam=K.camera,G=24;

const TRACKS=[['Dunas de Mira',12,[[0,0],[40,0],[52,4],[58,0],[90,0],[104,7],[112,0],[150,0],[160,3],[168,3],[176,0],[210,0],[226,9],[234,0],[270,0],[282,5],[290,5],[296,0],[330,0]]],
 ['Pedreira',16,[[0,0],[30,0],[44,6],[50,6],[54,0],[80,0],[90,10],[96,10],[100,0],[130,0],[146,12],[152,0],[180,4],[190,4],[198,0],[230,0],[240,8],[250,0],[262,6],[270,0],[310,0],[326,14],[334,0],[370,0]]],
 ['Monte Real',20,[[0,0],[24,0],[40,10],[46,0],[70,0],[84,13],[90,13],[94,0],[120,0],[140,16],[146,0],[170,2],[176,9],[182,0],[214,0],[230,18],[236,0],[262,0],[274,7],[280,0],[288,7],[294,0],[330,0],[352,20],[358,0],[400,0]]]];
let H=[],track=0,world=null,LEN=0;
function hAt(x){if(x<=H[0][0])return H[0][1];for(let i=0;i<H.length-1;i++){const a=H[i],b=H[i+1];if(x<=b[0]){const t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(t*t*(3-2*t))*.0+(b[1]-a[1])*t*1;}}return H[H.length-1][1];}
function slope(x){return (hAt(x+.3)-hAt(x-.3))/.6;}
function build(i){track=i;H=TRACKS[i][2];LEN=H[H.length-1][0];if(world)scene.remove(world);world=new THREE.Group();scene.add(world);
 const pts=[];for(let x=-20;x<=LEN+20;x+=1)pts.push(x);const pos=[],idx=[];pts.forEach((x,k)=>{const y=hAt(x);pos.push(x,y,-5,x,y,5,x,-3,-5,x,-3,5);if(k){const a=(k-1)*4,b=k*4;idx.push(a,a+1,b,a+1,b+1,b,a,b,a+2,b,b+2,a+2,a+1,a+3,b+1,b+1,a+3,b+3);}});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xc98a4f,side:THREE.DoubleSide}));m.receiveShadow=true;world.add(m);
 K.plane(1200,400,0xe6c58a,LEN/2,-3,0,world);
 for(let k=0;k<60;k++){const x=K.rand(-40,LEN+40),z=K.pick([-1,1])*K.rand(12,90),d=K.sph(K.rand(6,16),0xe8cf98,x,-4,z,world,8);d.scale.y=.4;}
 for(let k=0;k<40;k++){const x=K.rand(0,LEN),z=-K.rand(9,40);K.palm(x,z,K.rand(.7,1.1),world);}
 for(let x=0;x<LEN;x+=6)for(const z of [-5.5,5.5])K.box(.5,.5,.5,x%12?0xff3d5a:0xffffff,x,hAt(x)+.25,z,world);
 for(const [x,t] of [[0,'PARTIDA'],[LEN-6,'META']]){for(const z of [-6,6])K.cyl(.3,.3,7,0xffffff,x,hAt(x)+3.5,z,world,8);const b=new THREE.Mesh(new THREE.BoxGeometry(.3,1.5,12),new THREE.MeshBasicMaterial({map:K.tex(512,64,(c,w,h)=>{c.fillStyle='#1b2340';c.fillRect(0,0,w,h);c.fillStyle='#ffd23f';c.font='900 44px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(t,w/2,34);})}));b.position.set(x,hAt(x)+6.6,0);b.rotation.y=Math.PI/2;world.add(b);}
 for(let k=0;k<5;k++){const c=K.cloud(K.rand(0,LEN),K.rand(40,70),K.rand(-120,-60),K.rand(3,5));scene.remove(c);world.add(c);}
 const fans=[];for(let k=0;k<30;k++){const x=K.rand(10,LEN-10),p=K.person({shirt:K.pick([0xff3d5a,0xffd23f,0x2a8bff,0x35d07f,0xffffff]),parent:world});p.position.set(x,hAt(x),-K.rand(8,12));p.rotation.y=0;}}
// mota
const bike=new THREE.Group(),bb=new THREE.Group();bike.add(bb);scene.add(bike);
K.box(1.5,.35,.3,0xff8a3d,0,.75,0,bb);K.box(.6,.25,.32,0x222222,-.2,1,0,bb);K.box(.5,.4,.3,0x333333,.1,.55,0,bb);K.box(.08,.7,.08,0xaaaaaa,.75,.85,0,bb).rotation.z=-.4;K.box(.08,.08,.7,0x222222,.9,1.2,0,bb);
const wheels=[];for(const x of [-.75,.85]){const w=K.cyl(.42,.42,.18,0x15171d,x,.42,0,bb,14);w.rotation.x=Math.PI/2;wheels.push(w);}
const rider=K.person({shirt:0xff8a3d,shorts:0x1b2340,parent:bb,s:.8});rider.position.set(-.15,.75,0);rider.rotation.y=Math.PI/2;K.pose(rider,{legL:[-1,0,0],legR:[-1,0,0],armL:[-1.3],armR:[-1.3]});K.box(.32,.32,.32,0xffd23f,0,2.05*.8,0,rider).position.set(0,1.62,0);
const st={x:0,y:0,vx:0,vy:0,a:0,va:0,air:false,airT:0,rot:0,crash:0,t:0,flips:0,fin:0,lastFlip:0};
let state='menu',eng=null,engG=null,ghost=[],rec=[];
function engine(on){const ac=K.audio();if(!ac)return;if(on&&!eng){eng=ac.createOscillator();eng.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;engG=ac.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(ac.destination);eng.start();}if(!on&&eng){try{eng.stop();}catch{}eng=null;engG=null;}}
const tfmt=t=>t.toFixed(2)+' s';
function start(i){build(i);Object.assign(st,{x:2,y:hAt(2),vx:0,vy:0,a:0,va:0,air:false,rot:0,crash:0,t:0,flips:0,fin:0});rec=[];state='count';cd=3.5;K.screen(null);K.play(true);K.pad([['KeyW','Acelerar'],['KeyA','◀ Inclinar'],['KeyD','Inclinar ▶'],['KeyS','Travar']]);engine(true);
 K.hud(`<div class="k-tl"><div class="k-pill"><small>${TRACKS[i][0]}</small><b id="ht">0.00 s</b></div></div><div class="k-tr"><div class="k-pill"><small>Mortais</small><b id="hf">0</b></div></div><div class="k-tc"><div class="k-meter" style="width:min(300px,50vw);height:12px"><i id="hp" style="width:0;background:#ff8a3d"></i></div></div><div class="k-bc"><div class="k-hint">W acelera · no ar A/D inclina (dá mortais) · aterra com as rodas!</div></div>`);}
let cd=0;
function crash(){st.crash=1.6;K.sfx.hit();K.shake=.6;K.burst(new THREE.Vector3(st.x,st.y+.8,0),[0xc98a4f,0xffd23f],20,4,6,.8);K.flash('QUEDA!','',900,'#ff6b6b');st.t+=2;}
function finish(){state='done';engine(false);K.play(false);const b=S.data.best[track],rec2=!b||st.t<b;if(rec2)S.data.best[track]=+st.t.toFixed(2);S.data.flips+=st.flips;S.save();K.sfx.win();K.confetti(new THREE.Vector3(st.x,st.y+2,0));if(st.flips>=3)K.unlock('mo-3','Motocross · 3 mortais numa corrida');
 K.screen(`<div class="k-title"><em>${tfmt(st.t)}</em></div><div class="k-lead">${rec2?'Novo recorde!':'Recorde: '+tfmt(b)} · ${st.flips} mortais (−${st.flips} s)</div><button class="k-go" data-a="r">Repetir</button>${track<2?'<button class="k-alt" data-a="n">Próxima pista</button>':''}<button class="k-alt" data-a="m">Menu</button>`,{r:()=>start(track),n:()=>start(track+1),m:menu});}
function menu(){state='menu';engine(false);K.play(false);if(!world)build(0);
 K.screen(`<div class="k-title">Motocross das <em>Dunas</em></div><div class="k-lead">Salta, dá mortais no ar (cada um tira 1 segundo) e aterra direito.</div><div class="k-row">${TRACKS.map((t,i)=>`<button class="k-chip" data-a="go" data-v="${i}">${t[0]}<small>${S.data.best[i]?tfmt(S.data.best[i]):'sem recorde'}</small></button>`).join('')}</div><table class="k-tab"><tr><td>Mortais no total</td><td>${S.data.flips}</td></tr></table>${K.keysHelp([['W','acelerar'],['S','travar'],['A D','inclinar (no ar: mortais)'],['P','pausa']])}`,{go:v=>start(+v)});}
K.onQuit=menu;K.me=()=>state==='race'?bike:null;
function update(dt){
 if(state==='menu'||state==='done'){const t=K.time*.1;cam.position.set(((t*40)%LEN),hAt((t*40)%LEN)+8,22);cam.lookAt((t*40)%LEN+10,hAt((t*40)%LEN),0);return;}
 if(state==='count'){const pp=Math.ceil(cd-.5);cd-=dt;const n=Math.ceil(cd-.5);if(n!==pp){if(n>0){K.flash(String(n),'',700,'#ffd23f');K.tone(440,.18,'square',.1);}else{K.flash('VAI!','',700,'#3dffa2');K.tone(880,.4,'square',.12);state='race';}}}
 const gas=K.down('KeyW','ArrowUp','Space'),brk=K.down('KeyS','ArrowDown'),lean=(K.down('KeyA','ArrowLeft')?1:0)-(K.down('KeyD','ArrowRight')?1:0),ax=K.axis();const ln=lean||(-ax.x);
 if(state==='race'){st.t+=dt;
  if(st.crash>0){st.crash-=dt;st.vx*=Math.pow(.2,dt);if(st.crash<=0){st.y=hAt(st.x);st.a=Math.atan(slope(st.x));st.va=0;st.air=false;st.vx=2;}}
  else if(!st.air){const sl=Math.atan(slope(st.x));st.a=K.damp(st.a,sl,14,dt);const acc=(gas||ax.y>.3?18:0)-(brk?22:0)-Math.sin(sl)*G*.9;st.vx+=acc*dt;st.vx*=Math.pow(.92,dt);st.vx=K.clamp(st.vx,-4,TRACKS[track][1]+8);
   const nx=st.x+st.vx*dt*Math.cos(sl),ny=hAt(nx);const nsl=Math.atan(slope(nx));if(nsl<sl-.25&&st.vx>6){st.air=true;st.vy=st.vx*Math.sin(sl);st.va=0;st.rot=0;st.airT=0;}st.x=nx;st.y=st.air?st.y+st.vy*dt:ny;}
  else{st.airT+=dt;st.vy-=G*dt;st.x+=st.vx*Math.cos(0)*dt*.98;st.y+=st.vy*dt;st.va=K.damp(st.va,ln*4.2,5,dt);st.a+=st.va*dt;st.rot+=st.va*dt;
   const fl=Math.floor(Math.abs(st.rot)/(Math.PI*2));if(fl>st.lastFlip){st.lastFlip=fl;st.flips++;st.t-=1;K.flash('MORTAL!','−1 s',800,'#ff8a3d');K.sfx.good();}
   const gy=hAt(st.x);if(st.y<=gy){const sl=Math.atan(slope(st.x)),d=Math.abs(K.angDiff(st.a,sl));st.y=gy;st.air=false;st.lastFlip=0;if(d>.7){crash();st.a=sl;}else{st.a=sl;st.vx*=1-d*.4;K.sfx.bounce(.8);if(st.airT>1)K.toast('Boa aterragem!');}}}

 else if(state==='fin'){st.vx*=Math.pow(.3,dt);st.x+=st.vx*dt;st.y=hAt(st.x);}

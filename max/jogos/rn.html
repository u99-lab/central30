<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Toca a Campainha</title>
<style>

<script>
// Kit comum dos jogos novos da Central 30 MAX (motor, comandos, som, menus).
(()=>{'use strict';
const K=window.K={time:0,paused:false,inGame:false,shake:0};

 coin:()=>{K.tone(988,.07,'square',.07);K.tone(1319,.14,'square',.07,0,.07);},good:()=>[523,659,784].forEach((f,i)=>K.tone(f,.14,'triangle',.14,0,i*.08)),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>K.tone(f,.2,'triangle',.15,0,i*.12)),

let flT=0;K.flash=(text,sub='',ms=1500,color='#fff')=>{const f=$('k-flash');f.style.setProperty('--fc',color);f.innerHTML='<b>'+text+'</b>'+(sub?'<span>'+sub+'</span>':'');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');clearTimeout(flT);flT=setTimeout(()=>f.classList.remove('on'),ms);};

K.keysHelp=rows=>'<div class="k-keys">'+rows.map(r=>r[0].split(' ').map(k=>'<kbd>'+k+'</kbd>').join('')+' '+r[1]).join(' &nbsp;·&nbsp; ')+'</div>';
// ---------- 3D
const mats=new Map();
K.mat=(c,o)=>{if(c&&c.isMaterial)return c;const k=c+(o?JSON.stringify(o):'');let m=mats.get(k);if(!m){m=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));mats.set(k,m);}return m;};
K.mesh=(geo,c,x=0,y=0,z=0,p)=>{const m=new THREE.Mesh(geo,K.mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||K.scene).add(m);return m;};

K.box=(w,h,d,c,x,y,z,p)=>K.mesh(G('b'+w+','+h+','+d,()=>new THREE.BoxGeometry(w,h,d)),c,x,y,z,p);

K.sph=(r,c,x,y,z,p,seg=18)=>K.mesh(G('s'+r+','+seg,()=>new THREE.SphereGeometry(r,seg,Math.max(8,seg*.7|0))),c,x,y,z,p);

K.tex=(w,h,draw,rep)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;};
K.init=(o={})=>{const r=K.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.domElement.id='k-canvas';document.body.prepend(r.domElement);
 const s=K.scene=new THREE.Scene(),sky=o.sky===undefined?0x8fd3ff:o.sky;s.background=new THREE.Color(sky);if(o.fog)s.fog=new THREE.Fog(o.fogColor===undefined?sky:o.fogColor,o.fog[0],o.fog[1]);

// o sol segue um ponto (para sombras em mundos grandes)

K.person=(o={})=>{const g=new THREE.Group(),skin=o.skin||0xf0c8a0,shirt=o.shirt||0xe8452c,shorts=o.shorts||0x22305a,hair=o.hair||0x3a2a1c,P={};
 P.torso=K.box(.52,.62,.28,shirt,0,1.08,0,g);K.box(.54,.22,.3,shorts,0,.72,0,g);
 P.head=K.box(.36,.36,.36,skin,0,1.6,0,g);K.box(.38,.13,.38,hair,0,1.79,0,g);K.box(.38,.2,.1,hair,0,1.68,-.15,g);
 for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.14,.66,0);g.add(leg);K.box(.19,.5,.21,o.legs||skin,0,-.25,0,leg);K.box(.19,.16,.21,o.socks||0xffffff,0,-.5,0,leg);K.box(.2,.12,.32,o.shoes||0x222222,0,-.62,.05,leg);P[s<0?'legL':'legR']=leg;

 g.userData.P=P;(o.parent||K.scene).add(g);if(o.s)g.scale.setScalar(o.s);return g;};

 else{if(K.hit('KeyA','ArrowLeft'))act('l');if(K.hit('KeyD','ArrowRight'))act('r');if(K.hit('KeyW','ArrowUp','Space'))act('u');if(K.hit('KeyS','ArrowDown'))act('d');
  sp=Math.min(maxSp,sp+dt*(stumble>0?0:endless?.22:.5+(maxSp-sp)*.25));if(stumble>0)stumble-=dt;if(inv>0)inv-=dt;if(magnet>0)magnet-=dt;if(slide>0)slide-=dt;
  z+=sp*dt;dist=z;runT+=dt*sp*.75;x=K.damp(x,LX[lane],16,dt);vy-=24*dt;y+=vy*dt;if(y<=0){if(vy<-6)K.sfx.bounce(.4);y=0;vy=0;}
  if(endless)clock+=dt;else{const c0=Math.ceil(clock);clock-=dt;const c1=Math.ceil(clock);if(c1!==c0&&c1<=5&&c1>0)K.sfx.tick();if(clock<=0){K.sfx.horn();endDay(false);return;}}
  // gerar
  const diff=endless?Math.min(1,dist/1500):.2+day*.17;while(spawnZ<z+130&&spawnZ<goal-30){row(spawnZ,diff);spawnZ+=K.rand(13,19)+sp*.35;}
  
  // objetos
  for(const o of objs){if(o.dead)continue;if(o.v){o.z+=o.v*dt;o.m.position.z=o.z;}const dz=o.z-z;
   if(o.t==='coin'||o.t==='ima'||o.t==='mochila'){o.m.rotation.y+=dt*5;if(magnet>0&&o.t==='coin'&&dz<9&&dz>-1){o.m.position.x=K.damp(o.m.position.x,x,9,dt);o.m.position.y=K.damp(o.m.position.y,y+1,9,dt);o.z=K.damp(o.z,z,7,dt);o.m.position.z=o.z;}
    if(Math.abs(dz)<.9&&Math.abs(o.m.position.x-x)<.9&&Math.abs(o.m.position.y-(y+1))<1.1){o.dead=true;scene.remove(o.m);if(o.t==='coin'){got++;K.sfx.coin();}else if(o.t==='ima'){magnet=8;K.sfx.good();K.flash('ÍMAN!','',700,'#ff6b6b');}else{shield=true;K.sfx.good();K.flash('MOCHILA-ESCUDO','',700,'#4fd0ff');}}}
   else if(Math.abs(dz)<o.len+.35&&Math.abs(LX[o.lane]-x)<1){if(o.low){if(slide<=0)hit(o);}else if(y<o.h-.12)hit(o);if(state!=='run')return;}}
  if(z>goal){arrive();return;}
  // boneco
  boy.position.set(x,y,z);boy.rotation.z=(LX[lane]-x)*-.12;boy.visible=inv<=0||Math.floor(K.time*14)%2===0;shieldM.visible=shield;
  if(slide>0&&y<=.01){boy.rotation.x=-1.25;boy.position.y=.25;K.pose(boy,{legL:[1.2],legR:[.9],armL:[.5],armR:[.5]});}
  else{boy.rotation.x=stumble>0?.5:.12;if(y>.05)K.pose(boy,{legL:[.9],legR:[-.5],armL:[-2.4],armR:[-2.4]});else K.walk(boy,runT,1.15);}
  cam.position.x=K.damp(cam.position.x,x*.55,8,dt);cam.position.y=K.damp(cam.position.y,3.5+y*.3,6,dt);cam.position.z=z-6.2;cam.lookAt(x*.6,1.5,z+7);
  const hc=K.$('hc');if(hc){const c=Math.max(0,Math.ceil(clock));hc.textContent=Math.floor(c/60)+':'+String(c%60).padStart(2,'0');hc.style.color=!endless&&clock<6?'#ff6b6b':'';K.$('hg').textContent=got;K.$('hb').style.width=(endless?(dist%500)/5:dist/goal*100)+'%';const pw=K.$('hpw');pw.style.display=magnet>0||shield?'block':'none';pw.textContent=(magnet>0?'🧲 '+Math.ceil(magnet)+'s ':'')+(shield?'🎒':'');if(endless)hc.textContent=Math.floor(dist)+' m';}}
 // cenário
 road.position.set(0,0,z+90);roadT.offset.y=-(z/8)%1;walks.forEach(w=>{w.position.z=z+90;w.material.map.offset.y=-(z/2)%1;});grass.position.z=z+60;K.sunFollow(0,z+8);
 while(decoZ<z+150&&decoZ<goal-4){decoRow(decoZ);decoZ+=K.rand(10,12.5);}
 for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.dead||o.z<z-12){scene.remove(o.m);objs.splice(i,1);}}
 for(let i=deco.length-1;i>=0;i--)if(deco[i].z<z-22){scene.remove(deco[i].m);deco.splice(i,1);}}
K.loop(update);menu();
})();

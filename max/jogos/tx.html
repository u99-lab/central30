<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Táxi da Figueira</title>
<style>

.k-lead{color:#b9c2e6;font-weight:600;margin-bottom:18px}

</style>

<script>
// Kit comum dos jogos novos da Central 30 MAX (motor, comandos, som, menus).
(()=>{'use strict';

 coin:()=>{K.tone(988,.07,'square',.07);K.tone(1319,.14,'square',.07,0,.07);},good:()=>[523,659,784].forEach((f,i)=>K.tone(f,.14,'triangle',.14,0,i*.08)),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>K.tone(f,.2,'triangle',.15,0,i*.12)),

let flT=0;K.flash=(text,sub='',ms=1500,color='#fff')=>{const f=$('k-flash');f.style.setProperty('--fc',color);f.innerHTML='<b>'+text+'</b>'+(sub?'<span>'+sub+'</span>':'');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');clearTimeout(flT);flT=setTimeout(()=>f.classList.remove('on'),ms);};

K.keysHelp=rows=>'<div class="k-keys">'+rows.map(r=>r[0].split(' ').map(k=>'<kbd>'+k+'</kbd>').join('')+' '+r[1]).join(' &nbsp;·&nbsp; ')+'</div>';
// ---------- 3D
const mats=new Map();
K.mat=(c,o)=>{if(c&&c.isMaterial)return c;const k=c+(o?JSON.stringify(o):'');let m=mats.get(k);if(!m){m=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));mats.set(k,m);}return m;};

const geos=new Map(),G=(k,f)=>{let g=geos.get(k);if(!g){g=f();geos.set(k,g);}return g;};
K.box=(w,h,d,c,x,y,z,p)=>K.mesh(G('b'+w+','+h+','+d,()=>new THREE.BoxGeometry(w,h,d)),c,x,y,z,p);
K.cyl=(rt,rb,h,c,x,y,z,p,seg=16)=>K.mesh(G('c'+rt+','+rb+','+h+','+seg,()=>new THREE.CylinderGeometry(rt,rb,h,seg)),c,x,y,z,p);
K.sph=(r,c,x,y,z,p,seg=18)=>K.mesh(G('s'+r+','+seg,()=>new THREE.SphereGeometry(r,seg,Math.max(8,seg*.7|0))),c,x,y,z,p);

K.tex=(w,h,draw,rep)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;};
K.init=(o={})=>{const r=K.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.domElement.id='k-canvas';document.body.prepend(r.domElement);

// o sol segue um ponto (para sombras em mundos grandes)
K.sunFollow=(x,z)=>{const o=K.sun.userData.off||(K.sun.userData.off=K.sun.position.clone());K.sun.position.set(x+o.x,o.y,z+o.z);K.sun.target.position.set(x,0,z);};
K.person=(o={})=>{const g=new THREE.Group(),skin=o.skin||0xf0c8a0,shirt=o.shirt||0xe8452c,shorts=o.shorts||0x22305a,hair=o.hair||0x3a2a1c,P={};
 P.torso=K.box(.52,.62,.28,shirt,0,1.08,0,g);K.box(.54,.22,.3,shorts,0,.72,0,g);

 for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.14,.66,0);g.add(leg);K.box(.19,.5,.21,o.legs||skin,0,-.25,0,leg);K.box(.19,.16,.21,o.socks||0xffffff,0,-.5,0,leg);K.box(.2,.12,.32,o.shoes||0x222222,0,-.62,.05,leg);P[s<0?'legL':'legR']=leg;
  const arm=new THREE.Group();arm.position.set(s*.34,1.34,0);g.add(arm);K.box(.15,.26,.17,shirt,0,-.1,0,arm);K.box(.13,.4,.15,o.gloves||skin,0,-.42,0,arm);P[s<0?'armL':'armR']=arm;}

<script>
// TITLE: Táxi da Figueira

function mkCar(col,taxi){const g=new THREE.Group(),b=new THREE.Group();g.add(b);K.box(1.9,.55,4.2,col,0,.62,0,b);K.box(1.7,.5,2.1,col,0,1.1,-.2,b);K.box(1.6,.38,2,0x9fd8ff,0,1.12,-.2,b).scale.set(1.04,1,.9);if(taxi){K.box(.7,.22,.3,0x1b1b1b,0,1.47,-.2,b);K.box(1.92,.14,4.22,0x1b1b1b,0,.5,0,b);}

const pickM=marker(0xffd23f,'🙋'),dropM=marker(0x3dffa2,'🏁'),pax=K.person({shirt:0xff3d8b});pax.visible=false;
let state='menu',me=null,civs=[],goal={x:0,z:0},has=false,timer=0,score=0,rides=0,fare=0,mood=1,combo=0,eng=null,engG=null,stopT=0;
const NAMES=['a D. Rosa','o Sr. Manel','a Bia','o Rui','o Stôr Paulo','a avó do Isaac','um turista','a Mika'],PLACES=['à praia','ao estádio','à escola','ao mercado','à estação','ao casino','ao farol','ao centro'];
const car=(g,x,z)=>({g,x,z,a:0,sp:0,steer:0});

function newGoal(far){let i,j,n=0;do{i=K.irand(0,NB);j=K.irand(0,NB);n++;}while((Math.hypot(i*D-me.x,j*D-me.z)<(far?150:60)||Math.hypot(i*D-me.x,j*D-me.z)>(far?330:190))&&n<60);goal.x=i*D;goal.z=j*D;}

 for(let k=0;k<14;k++){const i=K.irand(0,NB),j=K.irand(0,NB),v=car(mkCar(K.pick([0x35d07f,0xe8352c,0xffffff,0x8a93ad,0x2a8bff,0xf4c2c2])),i*D,j*D);v.ni=i;v.nj=j;pickCiv(v);civs.push(v);}

function engine(on){const ac=K.audio();if(!ac)return;if(on&&!eng){eng=ac.createOscillator();eng.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=650;engG=ac.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(ac.destination);eng.start();}if(!on&&eng){try{eng.stop();}catch{}eng=null;engG=null;}}

function drive(c,thr,steer,hb,dt){const target=thr>0?c.top:thr<0?-8:0;if(c.sp<target)c.sp=Math.min(target,c.sp+12*dt);else c.sp=Math.max(target,c.sp-(thr<0||hb?26:7)*dt);c.steer=K.damp(c.steer,steer,10,dt);c.a-=steer*(hb?2.9:2.1)*Math.min(1,Math.abs(c.sp)/8)*(c.sp<0?-1:1)*dt;c.x+=Math.sin(c.a)*c.sp*dt;c.z+=Math.cos(c.a)*c.sp*dt;
 const s=solid(c.x,c.z)||solid(c.x+1.5,c.z)||solid(c.x-1.5,c.z)||solid(c.x,c.z+1.5)||solid(c.x,c.z-1.5);if(s){const dx=c.x-s[0],dz=c.z-s[1],px=BH+1.5-Math.abs(dx),pz=BH+1.5-Math.abs(dz);if(px>0&&pz>0){if(px<pz)c.x+=Math.sign(dx)*px;else c.z+=Math.sign(dz)*pz;if(Math.abs(c.sp)>10)crash();c.sp*=Math.pow(.05,dt);}}

 K.screen(`<div class="k-title"><em>${score} €</em></div><div class="k-lead">${rides} viagens${rec?' · Novo recorde!':' · Recorde: '+S.data.best+' €'}</div><button class="k-go" data-a="r">Outra vez</button><button class="k-alt" data-a="m">Garagem</button>`,{r:start,m:menu});}

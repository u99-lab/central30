<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Kart da Marginal</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#k-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.k-tl{top:calc(12px + env(safe-area-inset-top,0px));left:12px}.k-tr{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.k-tc{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
.k-bc{bottom:18px;left:50%;transform:translateX(-50%)}.k-bl{bottom:18px;left:14px}.k-br{bottom:18px;right:14px}
.k-pill{background:#0b1020cc;border:2px solid #ffffff2e;border-radius:14px;padding:7px 13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;backdrop-filter:blur(6px)}

.k-pill b{font-size:20px}

.k-meter{width:min(280px,60vw);height:20px;border-radius:999px;border:3px solid #fff;background:#0b1020aa;overflow:hidden;position:relative}

.k-title em{font-style:normal;color:var(--kc,#ffd23f)}
.k-lead{color:#b9c2e6;font-weight:600;margin-bottom:18px}
.k-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.k-lab{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#8f9bd0;margin-top:14px}
.k-go,.k-alt,.k-chip{font:800 16px/1 system-ui,sans-serif;color:#fff;border:0;cursor:pointer;border-radius:14px;padding:14px 20px;touch-action:manipulation}

.k-go:active{transform:translateY(4px);box-shadow:none}
.k-alt{display:block;width:100%;margin-top:10px;background:#ffffff14;border:2px solid #ffffff2a}
.k-alt:hover{background:#ffffff24}
.k-chip{background:#ffffff12;border:2px solid #ffffff26;padding:10px 14px;font-size:14px}
.k-chip.on{background:var(--kc,#ffd23f);border-color:var(--kc,#ffd23f);color:#0b1020}
.k-chip:disabled{opacity:.4;cursor:default}
.k-chip small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-top:4px}
.k-tab{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.k-tab td{padding:6px 8px;border-bottom:1px solid #ffffff1a;text-align:left}.k-tab td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.k-tab tr.me td{color:var(--kc,#ffd23f)}
.k-keys{margin-top:16px;font-size:12.5px;color:#9aa6d6;font-weight:600;line-height:1.7}
.k-keys kbd{font:800 11px system-ui;background:#ffffff1c;border:1px solid #ffffff33;border-bottom-width:3px;border-radius:6px;padding:2px 6px;color:#fff;margin:0 2px}
#k-toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);z-index:4;opacity:0;pointer-events:none;background:#0b1020e6;border:2px solid #ffffff33;border-radius:999px;padding:9px 18px;font-weight:800;transition:.25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#k-toast.on{opacity:1;transform:translate(-50%,0)}
#k-pad{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
#k-pad.on{display:block}
#k-stick{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #ffffff55;background:#ffffff14;display:none;margin:-60px 0 0 -60px}
#k-stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#ffffffcc}
#k-btns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:12px;max-width:190px;pointer-events:auto}

#k-btns button.dn{background:#ffd23f;color:#0b1020}
#k-pbtn{position:fixed;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:44px;height:44px;border-radius:12px;border:2px solid #ffffff44;background:#0b1020aa;color:#fff;font:900 16px system-ui;display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<script>
// Kit comum dos jogos novos da Central 30 MAX (motor, comandos, som, menus).
(()=>{'use strict';
const K=window.K={time:0,paused:false,inGame:false,shake:0};

// ---------- gravação

K.down=(...c)=>c.some(k=>keys[k]);
const stick={x:0,y:0,id:null,ox:0,oy:0};K.stick=stick;K.useStick=false;
K.axis=()=>{let x=(K.down('KeyD','ArrowRight')?1:0)-(K.down('KeyA','ArrowLeft')?1:0)+stick.x,y=(K.down('KeyW','ArrowUp')?1:0)-(K.down('KeyS','ArrowDown')?1:0)+stick.y;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}return{x,y};};
const sEl=$('k-stick');

addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===stick.id){let dx=(t.clientX-stick.ox)/50,dy=(t.clientY-stick.oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}stick.x=dx;stick.y=-dy;sEl.firstChild.style.transform='translate('+dx*38+'px,'+dy*38+'px)';}},{passive:true});
const tEnd=e=>{for(const t of e.changedTouches)if(t.identifier===stick.id){stick.id=null;stick.x=stick.y=0;sEl.style.display='none';sEl.firstChild.style.transform='';}};

K.pad=list=>{const b=$('k-btns');b.innerHTML='';for(const [code,label] of list){const el=document.createElement('button');el.textContent=label;const dn=e=>{e.preventDefault();if(!keys[code])edge[code]=true;keys[code]=true;el.classList.add('dn');},up=e=>{e.preventDefault();keys[code]=false;el.classList.remove('dn');};el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);b.appendChild(el);}};

K.tone=(f,d=.12,type='sine',v=.18,f2,delay=0)=>{if(!ac||K.paused)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);};

K.sfx={click:()=>K.tone(660,.06,'square',.06),kick:()=>{K.tone(140,.14,'sine',.4,50);K.noise(.07,.2,900);},bounce:(v=1)=>K.tone(190,.09,'sine',.22*v,90),hit:()=>{K.noise(.12,.3,500);K.tone(110,.12,'triangle',.25,50);},
 coin:()=>{K.tone(988,.07,'square',.07);K.tone(1319,.14,'square',.07,0,.07);},good:()=>[523,659,784].forEach((f,i)=>K.tone(f,.14,'triangle',.14,0,i*.08)),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>K.tone(f,.2,'triangle',.15,0,i*.12)),
 bad:()=>{K.tone(220,.25,'sawtooth',.1,110);K.tone(160,.3,'sawtooth',.09,80,.15);},whistle:(long)=>{K.tone(2350,long?.7:.25,'square',.05);K.tone(2500,long?.7:.25,'sine',.07);},
 cheer:(v=1)=>{K.noise(1.6,.16*v,1400,0,.4);K.noise(1.2,.1*v,2600,.1,.6);},ooh:()=>K.noise(.8,.1,700,0,.5),whoosh:()=>K.noise(.25,.14,1800,0,1.5),boost:()=>{K.tone(200,.5,'sawtooth',.09,900);K.noise(.4,.1,3000);},tick:()=>K.tone(880,.05,'square',.07),horn:()=>K.tone(392,.5,'square',.08)};
// ---------- interface
K.hud=h=>{$('k-hud').innerHTML=h;};
let scrH={};
K.screen=(html,handlers)=>{const s=$('k-screen');if(html==null){s.hidden=true;s.innerHTML='';return;}scrH=handlers||{};s.innerHTML='<div class="k-box">'+html+'</div>';s.hidden=false;s.scrollTop=0;};
$('k-screen').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;K.audio();K.sfx.click();const f=scrH[b.dataset.a];if(f)f(b.dataset.v,b);});
let flT=0;K.flash=(text,sub='',ms=1500,color='#fff')=>{const f=$('k-flash');f.style.setProperty('--fc',color);f.innerHTML='<b>'+text+'</b>'+(sub?'<span>'+sub+'</span>':'');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');clearTimeout(flT);flT=setTimeout(()=>f.classList.remove('on'),ms);};
let toT=0;K.toast=t=>{const e=$('k-toast');e.textContent=t;e.classList.add('on');clearTimeout(toT);toT=setTimeout(()=>e.classList.remove('on'),2600);};
K.keysHelp=rows=>'<div class="k-keys">'+rows.map(r=>r[0].split(' ').map(k=>'<kbd>'+k+'</kbd>').join('')+' '+r[1]).join(' &nbsp;·&nbsp; ')+'</div>';
// ---------- 3D
const mats=new Map();
K.mat=(c,o)=>{if(c&&c.isMaterial)return c;const k=c+(o?JSON.stringify(o):'');let m=mats.get(k);if(!m){m=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));mats.set(k,m);}return m;};
K.mesh=(geo,c,x=0,y=0,z=0,p)=>{const m=new THREE.Mesh(geo,K.mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||K.scene).add(m);return m;};
const geos=new Map(),G=(k,f)=>{let g=geos.get(k);if(!g){g=f();geos.set(k,g);}return g;};
K.box=(w,h,d,c,x,y,z,p)=>K.mesh(G('b'+w+','+h+','+d,()=>new THREE.BoxGeometry(w,h,d)),c,x,y,z,p);
K.cyl=(rt,rb,h,c,x,y,z,p,seg=16)=>K.mesh(G('c'+rt+','+rb+','+h+','+seg,()=>new THREE.CylinderGeometry(rt,rb,h,seg)),c,x,y,z,p);
K.sph=(r,c,x,y,z,p,seg=18)=>K.mesh(G('s'+r+','+seg,()=>new THREE.SphereGeometry(r,seg,Math.max(8,seg*.7|0))),c,x,y,z,p);
K.plane=(w,d,c,x,y,z,p)=>{const m=K.mesh(G('p'+w+','+d,()=>new THREE.PlaneGeometry(w,d)),c,x,y,z,p);m.rotation.x=-Math.PI/2;m.castShadow=false;return m;};
K.tex=(w,h,draw,rep)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;};
K.init=(o={})=>{const r=K.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.domElement.id='k-canvas';document.body.prepend(r.domElement);
 const s=K.scene=new THREE.Scene(),sky=o.sky===undefined?0x8fd3ff:o.sky;s.background=new THREE.Color(sky);if(o.fog)s.fog=new THREE.Fog(o.fogColor===undefined?sky:o.fogColor,o.fog[0],o.fog[1]);
 K.camera=new THREE.PerspectiveCamera(o.fov||55,1,.1,o.far||700);
 K.hemi=new THREE.HemisphereLight(o.skyLight||0xffffff,o.groundLight||0x7f9a6a,o.hemi===undefined?.78:o.hemi);s.add(K.hemi);
 const sun=K.sun=new THREE.DirectionalLight(o.sunColor||0xfff1d0,o.sunI===undefined?.85:o.sunI);sun.position.set(...(o.sunPos||[30,55,25]));sun.castShadow=true;const z=o.shadow||45;Object.assign(sun.shadow.camera,{left:-z,right:z,top:z,bottom:-z,near:1,far:260});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;s.add(sun);s.add(sun.target);
 const rs=()=>{r.setSize(innerWidth,innerHeight,false);K.camera.aspect=innerWidth/innerHeight;K.camera.updateProjectionMatrix();};addEventListener('resize',rs);rs();return s;};
// o sol segue um ponto (para sombras em mundos grandes)
K.sunFollow=(x,z)=>{const o=K.sun.userData.off||(K.sun.userData.off=K.sun.position.clone());K.sun.position.set(x+o.x,o.y,z+o.z);K.sun.target.position.set(x,0,z);};
K.person=(o={})=>{const g=new THREE.Group(),skin=o.skin||0xf0c8a0,shirt=o.shirt||0xe8452c,shorts=o.shorts||0x22305a,hair=o.hair||0x3a2a1c,P={};
 P.torso=K.box(.52,.62,.28,shirt,0,1.08,0,g);K.box(.54,.22,.3,shorts,0,.72,0,g);
 P.head=K.box(.36,.36,.36,skin,0,1.6,0,g);K.box(.38,.13,.38,hair,0,1.79,0,g);K.box(.38,.2,.1,hair,0,1.68,-.15,g);
 for(const s of [-1,1]){const leg=new THREE.Group();leg.position.set(s*.14,.66,0);g.add(leg);K.box(.19,.5,.21,o.legs||skin,0,-.25,0,leg);K.box(.19,.16,.21,o.socks||0xffffff,0,-.5,0,leg);K.box(.2,.12,.32,o.shoes||0x222222,0,-.62,.05,leg);P[s<0?'legL':'legR']=leg;
  const arm=new THREE.Group();arm.position.set(s*.34,1.34,0);g.add(arm);K.box(.15,.26,.17,shirt,0,-.1,0,arm);K.box(.13,.4,.15,o.gloves||skin,0,-.42,0,arm);P[s<0?'armL':'armR']=arm;}
 g.userData.P=P;(o.parent||K.scene).add(g);if(o.s)g.scale.setScalar(o.s);return g;};
K.walk=(p,t,amp=.9)=>{const P=p.userData.P,s=Math.sin(t)*amp;P.legL.rotation.x=s;P.legR.rotation.x=-s;P.armL.rotation.x=-s*.8;P.armR.rotation.x=s*.8;};

   if(k.dr){if(!drift||k.sp<9){if(k.ch>.7){k.boost=.45+Math.min(1.25,k.ch*.42);K.sfx.boost();K.flash(k.ch>2?'SUPER TURBO!':'TURBO!','',600,k.ch>2?'#ff8a3d':'#4fd0ff');if(k.ch>3.2)K.unlock('kt-drift','Kart · Derrapagem de mestre');}k.dr=0;k.ch=0;}else{k.ch+=dt*(.7+.6*Math.max(0,steer*k.dr));steer=k.dr*.6+steer*.7;if(Math.random()<dt*30)K.burst(new THREE.Vector3(k.x-Math.sin(k.a)*1,.2,k.z-Math.cos(k.a)*1),k.ch>2?0xff8a3d:k.ch>.7?0x4fd0ff:0xdddddd,2,2,2.5,.35);}}}
  k.a-=steer*(k.dr?2.5:1.95)*Math.min(1,Math.abs(k.sp)/9)*(k.sp<0?-1:1)*dt;}
 k.steer=K.damp(k.steer,steer,10,dt);const ma=k.a+k.dr*.24;k.x+=Math.sin(ma)*k.sp*dt;k.z+=Math.cos(ma)*k.sp*dt;nearest(k);
 const lim=HW+7.5;if(Math.abs(k.lat)>lim){const ex=k.lat-Math.sign(k.lat)*lim,n=Nr[k.idx];k.x-=n.x*ex;k.z-=n.z*ex;k.sp*=Math.pow(.2,dt);k.lat=Math.sign(k.lat)*lim;}
 // objetos
 if(state==='race'&&!k.fin){for(const b of boxes)if(b.t<=0&&!k.item&&(b.m.position.x-k.x)**2+(b.m.position.z-k.z)**2<3.6){b.t=4;b.m.visible=false;giveItem(k);K.burst(b.m.position,[0xffd23f,0xff8a3d],10,4,4,.5);}
  for(let i=bananas.length-1;i>=0;i--){const b=bananas[i];if((b.o!==k||b.t>.6)&&(b.x-k.x)**2+(b.z-k.z)**2<2){scene.remove(b.m);bananas.splice(i,1);spinOut(k,'CASCA!');}}}
 const g=k.g,u=g.userData;g.position.set(k.x,0,k.z);g.rotation.y=k.a-k.dr*.38+k.va;u.b.rotation.z=K.damp(u.b.rotation.z,k.steer*.07*Math.min(1,k.sp/20)+k.dr*.05,8,dt);u.b.position.y=off&&Math.abs(k.sp)>4?Math.sin(K.time*40+k.id)*.05:0;
 for(let i=0;i<4;i++){u.w[i].children[0].rotation.x+=k.sp*dt/.32;u.w[i].children[1].rotation.x+=k.sp*dt/.32;if(i<2)u.w[i].rotation.y=-k.steer*.45;}}
// ----- corrida
function startRace(i){buildTrack(i);grid();state='count';startT=3.6;raceT=0;lapT=0;bestLap=0;finishN=0;order=karts.slice();K.screen(null);K.play(true);K.useStick=true;K.pad([['Space','Derrapar'],['KeyE','Objeto'],['KeyB','Travar']]);hud();engine(true);camSnap();K.flash('3','',700,'#ffd23f');}
function engine(on){const ac=K.audio();if(!ac)return;if(on&&!eng){eng=ac.createOscillator();eng.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=700;engG=ac.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(ac.destination);eng.start();}if(!on&&eng){try{eng.stop();}catch{}eng=null;engG=null;}}
function hud(){K.hud(`<div class="k-tl" style="flex-direction:column;align-items:flex-start"><div class="k-pill"><small>Posição</small><b id="hp" style="font-size:34px">6º</b><span style="opacity:.6"> /6</span></div><canvas id="mm" width="120" height="120" style="width:120px;height:120px;background:#0b102099;border-radius:14px;border:2px solid #ffffff2e"></canvas></div>
 <div class="k-tr"><div class="k-pill"><small>Volta</small><b id="hl">1/${LAPS}</b></div><div class="k-pill"><small>Tempo</small><b id="ht">0:00.0</b></div></div>
 <div class="k-tc"><div class="k-pill" style="min-width:64px;text-align:center"><small>Objeto</small><b id="hi" style="font-size:26px">–</b></div></div><div class="k-bc"><div class="k-meter" id="hdw" style="width:160px;height:14px;opacity:0"><i id="hd" style="width:0;background:#4fd0ff"></i></div></div>`);}
function hudItem(){const e=K.$('hi');if(e)e.textContent=me.item?ITEMS[me.item]:'–';}
const tfmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor(t*10%10);
let camA=0;function camSnap(){camA=me.a;cam.position.set(me.x-Math.sin(me.a)*8,4,me.z-Math.cos(me.a)*8);}
function finishRace(){state='done';engine(false);K.play(false);const res=karts.slice().sort((a,b)=>(a.fin||1e9)-(b.fin||1e9)||b.prog-a.prog),pos=res.indexOf(me)+1,PTS=[10,7,5,3,2,1];
 const key=ti+'-'+diff,old=S.data.best[key];if(!old||me.fin<old)S.data.best[key]=+me.fin.toFixed(2);if(pos===1){S.data.wins++;K.sfx.win();K.unlock('kt-win'+ti,'Kart · Vitória em '+track.n);}else if(pos<=3)K.sfx.good();else K.sfx.bad();
 if(cup){res.forEach((k,i)=>cup.pts[k.id]+=PTS[i]);cup.r++;}S.save();
 const tab='<table class="k-tab">'+res.map((k,i)=>`<tr class="${k===me?'me':''}"><td>${i+1}º &nbsp;${k.name}</td><td>${k.fin?tfmt(k.fin):'—'}${cup?' &nbsp;+'+PTS[i]:''}</td></tr>`).join('')+'</table>';
 if(cup&&cup.r>=3){const tot=karts.slice().sort((a,b)=>cup.pts[b.id]-cup.pts[a.id]),won=tot[0]===me;if(won){S.data.cups++;S.save();K.unlock('kt-cup','Kart · Taça da Costa de Prata');K.sfx.win();}
  K.screen(`<div class="k-title">${won?'🏆 <em>Taça ganha!</em>':'Fim da taça'}</div><table class="k-tab">${tot.map((k,i)=>`<tr class="${k===me?'me':''}"><td>${i+1}º &nbsp;${k.name}</td><td>${cup.pts[k.id]} pts</td></tr>`).join('')}</table><button class="k-go" data-a="m">Menu</button>`,{m:menu});cup=null;return;}
 K.screen(`<div class="k-title">${pos===1?'<em>1.º lugar!</em>':pos+'.º lugar'}</div><div class="k-lead">${track.n} · melhor volta ${bestLap?tfmt(bestLap):'—'}</div>${tab}<button class="k-go" data-a="n">${cup?'Próxima corrida':'Repetir'}</button><button class="k-alt" data-a="m">Menu</button>`,{n:()=>startRace(cup?cup.r:ti),m:menu});}
function menu(){state='menu';engine(false);K.play(false);if(!world)buildTrack(0);if(!karts.length)grid();
 K.screen(`<div class="k-title">Kart da <em>Marginal</em></div><div class="k-lead">Derrapa para ganhar turbo, apanha as caixas e chega em primeiro.</div>
 <div class="k-lab">Dificuldade</div><div class="k-row">${DIFF.map((d,i)=>`<button class="k-chip${i===diff?' on':''}" data-a="d" data-v="${i}">${d[0]}</button>`).join('')}</div>
 <button class="k-go" data-a="cup">🏆 Taça da Costa de Prata (3 corridas)</button>
 <div class="k-lab">Corrida única</div><div class="k-row">${TRACKS.map((t,i)=>`<button class="k-chip" data-a="one" data-v="${i}">${t.n}<small>${S.data.best[i+'-'+diff]?'recorde '+tfmt(S.data.best[i+'-'+diff]):'sem recorde'}</small></button>`).join('')}</div>
 <table class="k-tab"><tr><td>Taças</td><td>${S.data.cups}</td></tr><tr><td>Vitórias</td><td>${S.data.wins}</td></tr></table>
 ${K.keysHelp([['W A S D','conduzir'],['ESPAÇO','derrapar (larga = turbo)'],['E','usar objeto'],['P','pausa']])}`,
 {d:v=>{diff=+v;menu();},cup:()=>{cup={r:0,pts:[0,0,0,0,0,0]};startRace(0);},one:v=>{cup=null;startRace(+v);}});}
K.onQuit=()=>{cup=null;menu();};
function update(dt){if(state==='menu'||state==='done'){const t=K.time*.12,j=Math.floor((t*40)%N+N)%N;cam.position.set(P[j].x+Nr[j].x*14,9,P[j].z+Nr[j].z*14);const q=P[(j+30)%N];cam.lookAt(q.x,1,q.z);K.sunFollow(P[j].x,P[j].z);if(state==='done')for(const k of karts)stepKart(k,dt);return;}
 if(state==='count'){const p=Math.ceil(startT-.6);startT-=dt;const n=Math.ceil(startT-.6);if(n!==p){if(n>0){K.flash(String(n),'',700,'#ffd23f');K.tone(440,.18,'square',.1);}else{K.flash('VAI!','',800,'#3dffa2');K.tone(880,.4,'square',.12);state='race';startBoostOk=true;}}}
 if(state==='race'){raceT+=dt;lapT+=dt;if(startBoostOk){if(raceT>.4)startBoostOk=false;else if(K.hit('KeyW','ArrowUp')){me.boost=1;startBoostOk=false;K.sfx.boost();K.flash('ARRANQUE PERFEITO!','',800,'#4fd0ff');K.unlock('kt-start','Kart · Arranque perfeito');}}}
 for(const k of karts){const lap0=Math.floor(k.prog/N);stepKart(k,dt);const lap1=Math.floor(k.prog/N);
  if(state==='race'&&lap1>lap0&&lap1>=1&&!k.fin){if(lap1>=LAPS){k.fin=raceT;finishN++;if(k===me){K.flash('META!',(order.indexOf(me)+1)+'.º lugar',2000,'#ffd23f');K.sfx.cheer();setTimeout(()=>{if(state==='race')finishRace();},2600);}}
   else if(k===me){if(!bestLap||lapT<bestLap)bestLap=lapT;K.flash(lap1+1===LAPS?'ÚLTIMA VOLTA!':'Volta '+(lap1+1),tfmt(lapT),1100,'#fff');K.sfx.good();lapT=0;}}}
 // choques entre karts
 for(let i=0;i<karts.length;i++)for(let j=i+1;j<karts.length;j++){const a=karts[i],b=karts[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<1.7&&d>.01){const p=(1.7-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*p;a.z-=nz*p;b.x+=nx*p;b.z+=nz*p;const s=(a.sp+b.sp)/2;a.sp=K.lerp(a.sp,s,.3);b.sp=K.lerp(b.sp,s,.3);if((a===me||b===me)&&Math.random()<.2)K.sfx.bounce(.5);}}
 for(const b of boxes){if(b.t>0){b.t-=dt;if(b.t<=0)b.m.visible=true;}b.m.rotation.y+=dt*2;b.m.rotation.x+=dt;b.m.position.y=1.2+Math.sin(K.time*3+b.m.position.x)*.15;}
 for(const b of bananas)b.t+=dt;
 for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.t+=dt;b.s+=50*dt/seg;const j=((Math.floor(b.s)%N)+N)%N;let tgt=null,bd=1e9;for(const k of karts){if(k===b.o||k.fin)continue;let d=k.prog-b.o.prog;if(d>0&&d<bd){bd=d;tgt=k;}}if(tgt)b.lat=K.damp(b.lat,tgt.lat,6,dt);const x=P[j].x+Nr[j].x*b.lat,z=P[j].z+Nr[j].z*b.lat;b.m.position.set(x,.6+Math.abs(Math.sin(b.t*9))*.5,z);b.m.rotation.x+=dt*12;let dead=b.t>5;
  for(const k of karts)if(k!==b.o&&(k.x-x)**2+(k.z-z)**2<3.4){spinOut(k,'BOLADA!');dead=true;if(b.o===me){K.sfx.good();K.toast('Acertaste no '+k.name+'!');}break;}if(dead){scene.remove(b.m);balls.splice(i,1);}}
 order=karts.slice().sort((a,b)=>(a.fin||1e9)-(b.fin||1e9)||b.prog-a.prog);
 // câmara e HUD
 camA+=K.angDiff(camA,me.a-me.dr*.2)*Math.min(1,dt*5);const bd=8+(me.boost>0?1.5:0),tx=me.x-Math.sin(camA)*bd,tz=me.z-Math.cos(camA)*bd;cam.position.x=K.damp(cam.position.x,tx,12,dt);cam.position.z=K.damp(cam.position.z,tz,12,dt);cam.position.y=K.damp(cam.position.y,3.7,5,dt);cam.lookAt(me.x+Math.sin(camA)*6,1.2,me.z+Math.cos(camA)*6);
 const fv=62+Math.max(0,me.sp-24)*.7+(me.boost>0?8:0);if(Math.abs(cam.fov-fv)>.2){cam.fov=K.damp(cam.fov,fv,4,dt);cam.updateProjectionMatrix();}K.sunFollow(me.x,me.z);
 if(engG){engG.gain.value=.03;eng.frequency.value=55+Math.abs(me.sp)*5.5+(me.dr?25:0);}
 const hp=K.$('hp');if(hp){hp.textContent=(order.indexOf(me)+1)+'º';K.$('hl').textContent=Math.min(LAPS,Math.max(1,Math.floor(me.prog/N)+1))+'/'+LAPS;K.$('ht').textContent=tfmt(raceT);K.$('hdw').style.opacity=me.dr?1:0;const hd=K.$('hd');hd.style.width=Math.min(100,me.ch/3.2*100)+'%';hd.style.background=me.ch>2?'#ff8a3d':me.ch>.7?'#4fd0ff':'#ddd';
  const mm=K.$('mm'),c=mm.getContext('2d');c.clearRect(0,0,120,120);let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(let i=0;i<N;i+=8){x0=Math.min(x0,P[i].x);x1=Math.max(x1,P[i].x);z0=Math.min(z0,P[i].z);z1=Math.max(z1,P[i].z);}const sc=100/Math.max(x1-x0,z1-z0),X=x=>10+(x-x0)*sc,Z=z=>10+(z-z0)*sc;c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();for(let i=0;i<=N;i+=8){const p=P[i%N];i?c.lineTo(X(p.x),Z(p.z)):c.moveTo(X(p.x),Z(p.z));}c.stroke();
  for(const k of karts){c.fillStyle='#'+COLS[k.id].toString(16).padStart(6,'0');c.beginPath();c.arc(X(k.x),Z(k.z),k===me?5:3.5,0,7);c.fill();if(k===me){c.strokeStyle='#fff';c.lineWidth=2;c.stroke();}}}}
const _sp=K.setPause;K.setPause=v=>{_sp(v);if(engG)engG.gain.value=K.paused?0:.03;};window.C30pause=f=>K.setPause(f===undefined?!K.paused:f);
K._dbg=()=>({seg,state,k:karts.map(k=>[k.name,Math.round(k.prog),+k.lat.toFixed(1),+k.sp.toFixed(0),k.fin?+k.fin.toFixed(1):0])});
K.loop(update);menu();
})();

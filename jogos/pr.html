<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poeira Rali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D stage; HUD pinned to the corners like a rally timing board; pace notes on co-driver notebook paper, top centre */
  --night:#0c0f12;
  --panel:rgba(14,16,18,.74);
  --line:rgba(255,232,190,.16);
  --chalk:#f4ede0;
  --dust:#c9a77a;
  --amber:#ffb627;
  --ink:#1f1b16;
  --paper:#f3ecdc;
  --rule:#a9bfd6;
  --margin:#d4554a;
  --good:#5fd38a;
  --bad:#ff6b5b;
  --mute:#a39b8c;
  --f-display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Permanent Marker','Comic Sans MS','Chalkboard SE',cursive;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--chalk);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--dust)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 14px 12px;min-width:170px}
.time{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.01em}
#tSplits{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-family:var(--f-display);font-size:16px;font-weight:600}
#tSplits div{display:flex;justify-content:space-between;gap:12px}
.d-good{color:var(--good)}.d-bad{color:var(--bad)}
.tr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:10px 14px 12px;width:220px}
.tr .stg{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;margin:2px 0 8px}
.prog{position:relative;height:6px;background:rgba(255,255,255,.14);border-radius:3px}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber);border-radius:3px}
#progGhost{position:absolute;top:-3px;width:3px;height:12px;background:#9fd3ff;border-radius:2px;display:none}
.prog i{position:absolute;top:-3px;width:2px;height:12px;background:var(--chalk);opacity:.7}
.tr .row{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--f-display);font-size:16px;font-weight:600}
#tPen{color:var(--bad)}
#notes{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-start}
.note{position:relative;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 22px;border-radius:3px;color:var(--ink);
  background:repeating-linear-gradient(180deg,transparent 0 17px,var(--rule) 17px 18px),var(--paper);
  box-shadow:0 6px 18px rgba(0,0,0,.35);transform:rotate(-1deg);transition:opacity .2s}
.note::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.8}
.note svg{width:54px;height:54px;flex:none}
.note .big{font-family:var(--f-hand);font-size:40px;line-height:.9}
.note .small{font-family:var(--f-hand);font-size:15px;line-height:1.1;white-space:nowrap}
.note .dist{font-family:var(--f-display);font-weight:700;font-size:13px;color:#6b6152}
.note.next{transform:rotate(1deg) scale(.78);transform-origin:top left;opacity:.86}
.note.caution .big{color:#b3261e}
.bl{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#mini{width:180px;height:180px;display:block;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(0,0,0,.4)}
.speedo{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 16px 12px;width:190px}
.speedo .top{display:flex;align-items:flex-end;justify-content:space-between}
#tSpeed{font-family:var(--f-display);font-weight:800;font-size:58px;line-height:.9}
.speedo .unit{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--mute);margin-top:2px}
#tGear{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--amber);border:2px solid var(--amber);border-radius:4px;width:40px;text-align:center;padding:2px 0}
.rpm{position:relative;height:8px;margin-top:10px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#rpmFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--dust) 0 70%,var(--amber) 70% 88%,var(--bad) 88%)}
.rpm::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),rgba(0,0,0,.55) calc(12.5% - 1px) 12.5%)}
#msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(42px,9vw,104px);line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.6);letter-spacing:.02em}
#toast{position:absolute;left:50%;top:56%;transform:translateX(-50%);font-family:var(--f-display);font-weight:700;font-size:24px;padding:6px 16px;border-radius:4px;background:var(--panel);border:1px solid var(--line);opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}
#lights{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;gap:12px;padding:12px 16px;background:#111;border-radius:8px;border:1px solid #333}
#lights b{width:30px;height:30px;border-radius:50%;background:#2a2a2a;box-shadow:inset 0 0 6px #000}
#lights b.r{background:#ff3b2f;box-shadow:0 0 18px #ff3b2f}
#lights b.g{background:#2fff7a;box-shadow:0 0 18px #2fff7a}
#wrong{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--bad);letter-spacing:.08em}
#hudBtns{position:absolute;top:calc(150px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:auto}
#hudBtns button{width:42px;height:42px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.05em}

/* ---------- touch ---------- */
#touch{position:fixed;inset:auto 0 0 0;height:46%;pointer-events:none}
#steerZone{position:absolute;left:0;bottom:0;width:48%;height:100%;pointer-events:auto}
#steerKnob{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);display:none}
#steerHint{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:13px;color:rgba(255,255,255,.55);padding:14px 22px;border:1px dashed rgba(255,255,255,.3);border-radius:40px}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,22,24,.45);font-family:var(--f-display);font-weight:800;letter-spacing:.06em;color:var(--chalk);display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(255,182,39,.45);border-color:var(--amber)}
#tbGas{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:96px;height:96px;font-size:18px}
#tbBrake{right:calc(126px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;font-size:14px}
#tbHb{right:calc(110px + env(safe-area-inset-right,0px));bottom:calc(108px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:13px}
body.touch .speedo{bottom:auto;top:calc(150px + env(safe-area-inset-top,0px));width:150px;padding:8px 12px}
body.touch #tSpeed{font-size:40px}
body.touch #hudBtns{top:calc(14px + env(safe-area-inset-top,0px));right:auto;left:50%;transform:translateX(-50%);display:none}
body.touch .bl{bottom:auto;top:calc(150px + env(safe-area-inset-top,0px))}
body.touch #mini{width:120px;height:120px}
body.touch #hudBtns{display:flex;top:auto;bottom:calc(200px + env(safe-area-inset-bottom,0px));left:auto;right:calc(14px + env(safe-area-inset-right,0px));transform:none}

/* ---------- menu ---------- */
.overlay{position:fixed;inset:0;display:flex;pointer-events:none}
.sheet{pointer-events:auto;background:linear-gradient(100deg,rgba(12,14,16,.94) 0 72%,rgba(12,14,16,.0));padding:calc(28px + env(safe-area-inset-top,0px)) 70px calc(28px + env(safe-area-inset-bottom,0px)) max(28px,calc(env(safe-area-inset-left,0px) + 16px));width:min(520px,100%);box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:18px;touch-action:pan-y}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(64px,13vw,104px);line-height:.8;letter-spacing:-.01em;color:var(--dust);transform:skewX(-9deg);text-shadow:0 2px 0 #5a4026}
.brand span{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.3em;color:var(--amber);transform:skewX(-9deg)}
.tag{margin:-6px 0 0;color:var(--mute);font-size:15px;max-width:40ch;line-height:1.45}
.stages{display:flex;flex-direction:column;gap:8px}
.stage{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;transition:background .15s,border-color .15s}
.stage:hover{background:rgba(255,255,255,.08)}
.stage.sel{border-color:var(--amber);background:rgba(255,182,39,.10)}
.stage .pec{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--amber);line-height:1}
.stage .pec b{display:block;font-size:30px;color:var(--chalk)}
.stage .nm{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.05}
.stage .meta{font-size:13px;color:var(--mute);margin-top:2px}
.stage .rec{font-family:var(--f-display);font-weight:600;font-size:16px;text-align:right;color:var(--chalk)}
.stage .rec small{display:block;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.row2{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.liveries{display:flex;gap:8px;margin-top:6px}
.liv{width:46px;height:30px;border-radius:4px;border:2px solid transparent;padding:0;overflow:hidden;background:none}
.liv.sel{border-color:var(--amber)}
.liv i{display:block;width:100%;height:100%}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:14px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--amber);width:16px;height:16px}
.go{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.12em;padding:10px 34px;border:0;border-radius:4px;background:var(--amber);color:#1b1305;transform:skewX(-9deg);box-shadow:0 6px 0 #9a6a08}
.go:active{transform:skewX(-9deg) translateY(3px);box-shadow:0 3px 0 #9a6a08}
.keys{font-size:13px;color:var(--mute);line-height:1.7}
.keys kbd{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--chalk);background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px}
#loading{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font-family:var(--f-display);font-weight:700;letter-spacing:.14em;color:var(--dust);font-size:14px}

/* ---------- results / pause ---------- */
.center{align-items:center;justify-content:center;background:rgba(8,10,12,.55)}
.card{pointer-events:auto;width:min(440px,calc(100% - 32px));padding:22px 24px;box-sizing:border-box;background:rgba(16,18,20,.94);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.card h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;transform:skewX(-6deg)}
.bigtime{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9}
.tbl{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:18px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;padding:9px 18px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1b1305}
.newrec{font-family:var(--f-hand);color:var(--amber);font-size:24px;transform:rotate(-3deg);align-self:flex-start}


.menu-btns{display:flex;flex-direction:column;gap:8px}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.mbtn small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--mute);margin-top:3px}
.mbtn b{color:var(--amber);font-size:30px}
.mbtn:hover{border-color:var(--amber);background:rgba(255,182,39,.08)}
.money{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--amber);white-space:nowrap}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.topline.wrap{flex-wrap:wrap}
.back{background:none;border:0;color:var(--mute);font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:14px;padding:4px 0}
.back:hover{color:var(--chalk)}
.card.wide{width:min(860px,calc(100% - 32px))}
.card>*{flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>div{min-width:0}
.tblwrap{overflow-x:auto;margin-top:6px}
.res{width:100%;border-collapse:collapse;font-size:14px}
.res th{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;font-size:11px;color:var(--dust);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.res td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.res td small{color:var(--mute);font-size:11px}
.res td em{color:var(--bad);font-style:normal;font-size:12px}
.res tr.me td{background:rgba(255,182,39,.16);color:var(--chalk);font-weight:600}
.res tr.done td{color:var(--mute);text-decoration:line-through}
.sumrow{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.bigpos{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9}
.bigpos small{font-size:22px;color:var(--mute)}
.champs{display:flex;flex-direction:column;gap:8px}
.champ{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.04)}
.champ .nm{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.champ .meta{font-size:13px;color:var(--mute);margin-top:2px}
.champ.locked{opacity:.5}
.champend{padding:12px 14px;border-radius:6px;border:1px solid var(--amber);background:rgba(255,182,39,.1);display:flex;flex-direction:column;gap:4px}
.champend.gold .bigpos{color:var(--amber)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--mute)}
.seg button.sel{background:var(--amber);color:#1b1305}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.carcard{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.04);min-width:0}
.carcard.sel{border-color:var(--amber);background:rgba(255,182,39,.08)}
.carcard .nm{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05}
.carcard .meta{font-size:13px;color:var(--mute)}
.carcard .price{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--amber);text-align:right;white-space:nowrap}
.carcard .btn{margin-top:auto}
.btn[disabled]{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--mute)}
.sbar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--dust)}
.carpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-family:var(--f-display);font-weight:700;font-size:15px}
.chip.sel{border-color:var(--amber);background:rgba(255,182,39,.15)}
.bonusline{padding:8px 12px;border-radius:5px;background:rgba(95,211,138,.12);border:1px solid rgba(95,211,138,.35);font-size:14px}
.pos{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--amber);margin-top:4px;min-height:1em}
.dmg{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.dmg .bar{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.dmg .bar i{display:block;height:100%;width:0;background:var(--dust)}
.dmg.bad{color:var(--bad)}.dmg.bad .bar i{background:var(--bad)}
#replayBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));padding:10px 14px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.rb-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
#rbProg{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;cursor:pointer}
#rbFill{height:100%;width:0;background:var(--amber)}
.rb-btns{display:flex;gap:6px;flex-wrap:wrap}
.rb-btns .btn{font-size:15px;padding:7px 12px}
@media (max-width:640px){.two{grid-template-columns:1fr}.hide-s{display:none}.bigpos{font-size:42px}}
@media (max-width:640px){
  .tr{width:150px;padding:8px 10px}
  .tr .stg{font-size:16px}
  .time{font-size:32px}
  .tl{min-width:0;padding:8px 10px}
  #notes{top:calc(98px + env(safe-area-inset-top,0px))}
  .note svg{width:40px;height:40px}.note .big{font-size:30px}
  .sheet{background:rgba(12,14,16,.93);padding-right:max(20px,calc(env(safe-area-inset-right,0px) + 16px))}
}
@media (max-height:560px){
  .sheet{gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:54px}
  .tag,.keys{display:none}
  .stage{padding:6px 10px;grid-template-columns:44px 1fr auto}
  .stage .pec b{font-size:22px}.stage .nm{font-size:17px}
  .go{position:sticky;bottom:0;font-size:22px;padding:8px 26px}
}
@media (prefers-reduced-motion:reduce){.note,#toast{transition:none}}
</style>
</head>
<body>


<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="tl panel">
    <div class="lbl">Tempo</div>
    <div id="tTime" class="time num">0:00.00</div>

function genPath(def) {

    let ok = true;
    for (let k = 1; k <= 3; k++) {
      const nx = a[0] + Math.sin(h) * 45 * k, nz = a[1] + Math.cos(h) * 45 * k;

   REF scales the ideal to a good, clean human drive. */
const REF = 1.2;
function idealTime(T, th, c) {
  const n = T.n, ds = T.ds, i0 = Math.round(T.startS / ds), i1 = Math.min(n - 1, Math.round(T.finishS / ds));
  const mu = th.grip * c.grip, m = c.mass + 80, P = c.cv * 735 * 0.8;
  const trac = mu * 9.81 * (c.front === 1 ? 0.58 : c.front === 0 ? 0.6 : 0.9), brk = mu * 9.81 * 0.92;
  const v = new Float64Array(n);
  for (let i = 0; i < n; i++) { const k = Math.abs(T.k[i]) + 1e-5; v[i] = Math.min(70, Math.sqrt(mu * 9.81 * 0.98 / k)); }
  v[i0] = 0;
  for (let i = i0; i < i1; i++) { const vv = Math.max(v[i], 2), a = Math.min(trac, P / (m * vv)) - 0.42 * vv * vv / m - 0.25; v[i + 1] = Math.min(v[i + 1], Math.sqrt(Math.max(0.5, v[i] * v[i] + 2 * a * ds))); }
  for (let i = i1 - 1; i >= i0; i--) { const a = brk + 0.42 * v[i + 1] * v[i + 1] / m; v[i] = Math.min(v[i], Math.sqrt(v[i + 1] * v[i + 1] + 2 * a * ds)); }
  const sp = T.splitS.map(s => Math.round(s / ds)); const splits = []; let t = 0;
  for (let i = i0; i < i1; i++) { t += ds / Math.max(0.5, (v[i] + v[i + 1]) / 2); if (sp.includes(i + 1)) splits.push(t); }
  while (splits.length < 3) splits.push(t * (splits.length + 1) / 4);
  return { total: t, splits };
}
function champField(ci) {
  const ch = CHAMPS[ci], r = mulberry32(hashStr(ch.id)), n = ch.bots.length;
  return ch.bots.map(([name, nat], i) => {
    const f = i / (n - 1);
    const car = CARS[ch.botCars[Math.round((1 - f) * (ch.botCars.length - 1))]].id;
    return { name, nat, car, skill: lerp(ch.skill[0], ch.skill[1], f) * (1 + (r() - 0.5) * 0.015) };
  });
}
function fieldForCar(c) { return c.cv <= 190 ? 0 : c.cv <= 300 ? 2 : 3; }
function botTimes(field, key) {
  const salt = (Math.random() * 1e9) | 0, r = mulberry32(hashStr(key + '#' + salt)), dk = DIFF[career.diff].k;
  return field.map(b => {
    const id = S.ideal[carIdx(b.car)];
    const form = 1 + (mulberry32(hashStr(b.name + key.replace(/-(\d+)(:\d+)?$/, '$2') + '#' + salt))() - 0.5) * 0.06; // forma do rival nesta tentativa
    let t = id.total * REF * b.skill * dk * form * (1 + gauss(r) * 0.026), note = '';
    const x = r();
    if (x < 0.035) { t += 6 + r() * 16; note = 'pião'; } else if (x < 0.047) { t += 30 + r() * 30; note = 'furo'; }
    const splits = id.splits.map(sp => sp / id.total * t);
    return { name: b.name, nat: b.nat, car: b.car, t, note, splits };
  });
}

  if (ghostPos) { mctx.fillStyle = '#9fd3ff'; mctx.beginPath(); mctx.arc((ghostPos[0] - car.x) * MAPS, (ghostPos[2] - car.z) * MAPS, 9, 0, 7); mctx.fill(); }
  mctx.restore();
  mctx.save(); mctx.translate(R, R); mctx.fillStyle = '#ffb627'; mctx.strokeStyle = '#1b1305'; mctx.lineWidth = 3;
  mctx.beginPath(); mctx.moveTo(0, -16); mctx.lineTo(11, 12); mctx.lineTo(0, 6); mctx.lineTo(-11, 12); mctx.closePath(); mctx.fill(); mctx.stroke(); mctx.restore();
}
let lastHud = { t: '', spd: -1, g: '', d: -1 };
let ghostIdx = 0;
function nearGhostIdx(x, z) { const T = S.T; let best = ghostIdx, bd = 1e18; for (let i = Math.max(0, ghostIdx - 40); i < Math.min(T.n, ghostIdx + 60); i++) { const dx = T.px[i] - x, dz = T.pz[i] - z, d = dx * dx + dz * dz; if (d < bd) { bd = d; best = i; } } ghostIdx = best; return best; }
const ghPose = {};
function updateHUD(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  if (state !== 'race' && state !== 'countdown') return;
  const T = S.T, spd = Math.hypot(car.vx, car.vz);
  const tt = fmt(race ? race.t + race.pen : 0); if (tt !== lastHud.t) { $('tTime').textContent = tt; lastHud.t = tt; }
  const kmh = Math.round(spd * 3.6); if (kmh !== lastHud.spd) { $('tSpeed').textContent = kmh; lastHud.spd = kmh; }
  const gr = car.gear < 0 ? 'R' : String(car.gear); if (gr !== lastHud.g) { $('tGear').textContent = gr; lastHud.g = gr; }
  const dm = Math.round(car.damage * 100); if (dm !== lastHud.d) { $('dmgFill').style.width = dm + '%'; $('dmgTxt').textContent = dm + '%'; $('dmg').classList.toggle('bad', dm > 40); lastHud.d = dm; }
  $('rpmFill').style.width = clamp((car.rpm - 800) / 7000 * 100, 0, 100) + '%';
  const prog = clamp((car.s - T.startS) / (T.finishS - T.startS), 0, 1);
  $('progFill').style.width = (prog * 100).toFixed(1) + '%';
  $('tRemain').textContent = (Math.max(0, T.finishS - car.s) / 1000).toFixed(1) + ' km';
  ghostPos = null;
  if (race && race.ghost && state === 'race') {
    const g = race.ghost, N = g.length / REC_N;
    if (race.t / REC_DT < N - 1) {
      const p = recPose(g, race.t, ghPose);
      ghostMesh.visible = true; ghostMesh.position.set(p.x, p.y, p.z); ghostMesh.rotation.set(0, p.h, 0); ghostPos = [p.x, p.y, p.z];
      const gp = project(p.x, p.z, nearGhostIdx(p.x, p.z)); $('progGhost').style.left = (clamp((gp.s - T.startS) / (T.finishS - T.startS), 0, 1) * 100).toFixed(1) + '%';
    } else ghostMesh.visible = false;
  }
  drawMinimap();
  if (race) {
    const vis2 = race.shown.filter(k => S.notes[k].e > car.s - 2).slice(0, 2);
    const key = vis2.join(',');
    if (key !== race.noteKey) {
      race.noteKey = key;
      $('notes').innerHTML = vis2.map((k, n) => { const nt = S.notes[k], L = noteLabel(nt), caution = nt.type === 'jump' || nt.grade <= 1; return `<div class="note${n ? ' next' : ''}${caution ? ' caution' : ''}">${arrowSVG(nt)}<div><div class="big">${L.big}</div><div class="small">${L.small}</div><div class="dist num" data-k="${k}"></div></div></div>`; }).join('');
    }
    for (const el of $('notes').querySelectorAll('.dist')) { const nt = S.notes[+el.dataset.k], d = nt.s - car.s; el.textContent = d > 0 ? Math.round(d / 10) * 10 + ' m' : 'agora'; }
  }
}

/* ---------------------------------------------------------------------
   Menu
   --------------------------------------------------------------------- */
let menuView = 'main', quickSel = 0;
function renderMenu() {
  const sh = $('menuSheet');
  const opts = `<div class="opts"><label><input type="checkbox" id="oVoice"><span>Voz do navegador</span></label><label><input type="checkbox" id="oSound"><span>Som</span></label><label><input type="checkbox" id="oShadow"><span>Sombras</span></label></div>`;
  if (menuView === 'main') {
    const cs = CHAMPS.map((c, i) => career.champs[c.id]).filter(Boolean);
    const sub = career.cur ? `A meio do ${CHAMPS[career.cur.ci].rallies[career.cur.ri].name}` : cs.length ? `${money(career.money)} na conta` : 'Nacional, Taça Lusófona, Europeu e Mundial';
    sh.innerHTML = `<div class="brand"><h1>POEIRA</h1><span>RALI</span></div>
      <p class="tag">Quatro campeonatos contra pilotos de todo o mundo. Ouve o navegador, mete o carro de lado e não beijes as árvores.</p>
      <div class="menu-btns">
        <button class="mbtn" id="mCareer"><span>Carreira<small>${esc(sub)}</small></span><b>›</b></button>
        <button class="mbtn" id="mQuick"><span>Prova rápida<small>Uma PEC contra o relógio e os rivais</small></span><b>›</b></button>
        <button class="mbtn" id="mGarage"><span>Garagem<small>${career.owned.length} de ${CARS.length} carros · ${esc(curCar().name)}</small></span><b>›</b></button>
      </div>
      <div><div class="lbl">Opções</div>${opts}</div>
      <div class="keys" id="keysHelp"></div>`;
    on('mCareer', showCareer); on('mQuick', () => { menuView = 'quick'; renderMenu(); }); on('mGarage', () => showGarage(goMenu));
  } else {
    const items = STAGES.map((d, k) => ({ d, k })); items.push({ d: { pec: '?', name: 'Prova aleatória', theme: null }, k: 'rnd' });
    sh.innerHTML = `<div class="topline"><button class="back" id="mBack">← MENU</button><div class="money num">${esc(curCar().name)}</div></div>
      <div><div class="lbl">Prova rápida · escolhe a PEC</div><div class="stages" id="stageList" style="margin-top:8px"></div></div>
      <div class="row2"><div><div class="lbl">Carro</div><div class="carpick" id="carPick"></div></div></div>
      <button class="go" id="bGo">PARTIR</button>
      <div class="keys" id="keysHelp"></div>`;
    const L = $('stageList');
    for (const { d, k } of items) {
      const b = document.createElement('button'); b.className = 'stage' + (quickSel === k ? ' sel' : ''); b.type = 'button';
      const best = k === 'rnd' ? null : store.get('poeira.best.' + d.id);
      const th = d.theme ? themeFor(d) : null;
      const meta = k === 'rnd' ? 'Terreno e traçado novos a cada passagem' : `${th.surface} · ${((d.len - 190) / 1000).toFixed(1)} km`;
      b.innerHTML = `<div class="pec">PEC<b>${d.pec}</b></div><div><div class="nm">${esc(d.name)}</div><div class="meta">${meta}</div></div><div class="rec num"><small>RECORDE</small>${best ? fmt(best.total) : '—'}</div>`;
      b.addEventListener('click', () => { quickSel = k; renderMenu(); const def = k === 'rnd' ? randomStage() : STAGES[k]; loadStage(def, () => { tv.idx = -1; }); });
      L.appendChild(b);
    }
    const cp = $('carPick');
    for (const id of career.owned) { const c = carById(id); const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (career.car === id ? ' sel' : ''); b.textContent = c.name; b.onclick = () => { career.car = id; saveCareer(); applyCar(c); makeCars(); renderMenu(); }; cp.appendChild(b); }
    on('mBack', () => { menuView = 'main'; renderMenu(); });
    on('bGo', () => { const def = quickSel === 'rnd' ? (stageDef && stageDef.random ? stageDef : randomStage()) : STAGES[quickSel]; beginStage(def, { mode: 'quick' }); });
  }
  if ($('oVoice')) {
  $('oVoice').checked = settings.voice; $('oSound').checked = settings.sound; $('oShadow').checked = settings.shadows;
  $('oVoice').onchange = e => { settings.voice = e.target.checked; saveSettings(); Snd.init(); Voice.load(); if (settings.voice) Voice.say(['boa'], true); };
  $('oSound').onchange = e => { settings.sound = e.target.checked; saveSettings(); Snd.setOn(settings.sound); };
  $('oShadow').onchange = e => { settings.shadows = e.target.checked; saveSettings(); if (S) sun.castShadow = settings.shadows && !S.th.night; };
  }
  $('keysHelp').innerHTML = isTouch ? 'Arrasta o polegar na metade esquerda do ecrã para virar. <b>GÁS</b>, <b>TRAVÃO</b> (mantém para marcha-atrás) e <b>MÃO</b> à direita.'
    : '<kbd>W</kbd>/<kbd>↑</kbd> acelerar · <kbd>S</kbd>/<kbd>↓</kbd> travar e marcha-atrás · <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> virar<br><kbd>Espaço</kbd> travão de mão · <kbd>C</kbd> câmara · <kbd>R</kbd> voltar à estrada (+5 s) · <kbd>Esc</kbd> pausa<br>Comando: RT acelera, LT trava, A é o travão de mão.';
}
function renderLiveries() {
  const L = $('livList'); if (!L) return; L.innerHTML = '';
  LIVERIES.forEach((lv, k) => {
    const b = document.createElement('button'); b.className = 'liv' + (career.livery === k ? ' sel' : ''); b.type = 'button'; b.title = lv.name; b.setAttribute('aria-label', 'Decoração ' + lv.name);
    b.innerHTML = `<i style="background:linear-gradient(115deg,${lv.base} 0 45%,${lv.a} 45% 62%,${lv.b} 62% 70%,${lv.base} 70%)"></i>`;
    b.addEventListener('click', () => { career.livery = k; saveCareer(); renderLiveries(); if (S) makeCars(); });
    L.appendChild(b);
  });
}
$('pResume').addEventListener('click', () => resumeGame());
$('pRetry').addEventListener('click', () => { $('pause').hidden = true; beginStage(S.def, { mode: 'quick' }); });
$('pQuit').addEventListener('click', () => { $('pause').hidden = true; if (session.mode === 'career') { state = 'race'; finishRace(true); } else goMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'race' || state === 'countdown')) pauseGame(); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); dustMat.uniforms.scale.value = innerHeight * 0.5; });

/* ---------------------------------------------------------------------
   Main loop
   --------------------------------------------------------------------- */
var prevPose = { x: 0, y: 0, z: 0, h: 0 }, rpose = { x: 0, y: 0, z: 0, h: 0 };
const STEP = 1 / 120; let acc = 0, last = performance.now(), clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!S) return;
  if (state === 'paused') { renderer.render(scene, camera); return; }
  clock += dt;
  let inp;
  if (state === 'race') inp = readInput();
  else if (state === 'countdown') { const r = readInput(); inp = { steer: 0, throttle: r.throttle, brake: 0, hb: 1, analog: false }; }
  else if (state === 'replay') inp = { steer: 0, throttle: 0.5, brake: car.brakeOn ? 1 : 0, hb: car.hb ? 1 : 0 };
  else { inp = autopilot(); readInput(); }
  if (state === 'replay') replayTick(dt);
  else {
    acc += dt;
    while (acc >= STEP) {
      acc -= STEP;
      prevPose.x = car.x; prevPose.y = car.y; prevPose.z = car.z; prevPose.h = car.h;
      if (state === 'countdown') {
        const target = 900 + inp.throttle * 6200; car.rpm = lerp(car.rpm, target, 1 - Math.exp(-STEP * (inp.throttle ? 6 : 3)));
        if (inp.throttle < 0.2 && car.thr > 0.6 && car.rpm > 4800) car.lastPop = 0.3; car.thr = inp.throttle;
        if (car.lastPop > 0) { car.lastPop -= STEP; if (Math.random() < STEP * 20) Snd.pop(); }
      } else stepCar(STEP, inp);
    }
  }
  { const a = state === 'replay' || state === 'countdown' ? 1 : clamp(acc / STEP, 0, 1);
    rpose.x = lerp(prevPose.x, car.x, a); rpose.y = lerp(prevPose.y, car.y, a); rpose.z = lerp(prevPose.z, car.z, a); rpose.h = prevPose.h + wrapA(car.h - prevPose.h) * a;
    if (Math.hypot(car.x - prevPose.x, car.z - prevPose.z) > 5) { rpose.x = car.x; rpose.y = car.y; rpose.z = car.z; rpose.h = car.h; } }
  if (race) raceTick(dt);
  if (state === 'menu' || state === 'finished' || state === 'loading') {
    if (car.idx > S.T.n - 30) { resetCarTo(S.T.startS - 8, true); tv.idx = -1; }
    car.stuckT = Math.hypot(car.vx, car.vz) < 1.5 ? car.stuckT + dt : 0;
    if (Math.abs(car.lat) > 20 || car.stuckT > 2.5) { resetCarTo(car.s, false); tv.idx = -1; }
  }
  updateCarVisual(dt, inp);
  updateDust(dt);
  updateCrowd(clock, false);
  updatePrecip(dt);
  sun.position.set(car.x + sunDir.x * 160, car.y + sunDir.y * 160, car.z + sunDir.z * 160); sun.target.position.set(car.x, car.y, car.z);
  updateCamera(dt);
  const active = state === 'race' || state === 'countdown' || state === 'finished' || state === 'replay';
  const spdNow = Math.hypot(car.vx, car.vz);
  Snd.update(car.rpm, state === 'replay' ? (car.brakeOn ? 0 : 0.8) : inp.throttle, spdNow, car.slip, car.onRoad, car.air, active && !(state === 'replay' && rp.paused));
  updateHUD(dt);
  renderer.render(scene, camera);
}

/* boot */
renderMenu();
state = 'loading';
requestAnimationFrame(frame);
applyCar(curCar());
loadStage(STAGES[0], () => { state = 'menu'; });
// Central 30: pause from the hub (Esc and the pause button are handled there)
window.C30pause = f => { if (state === 'replay') { rp.paused = f === undefined ? !rp.paused : !!f; updateReplayBar(); return; } const want = f === undefined ? state !== 'paused' : !!f; if (want) pauseGame(); else resumeGame(); };
window.C30isPaused = () => state === 'paused' || (state === 'replay' && rp.paused);
window.__poeira = { get S() { return S; }, car, get state() { return state; }, autopilot, get race() { return race; }, get career() { return career; } };

</script>

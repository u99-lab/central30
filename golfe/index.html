<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mini Golfe 30</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f0;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud[hidden]{display:none}
.chip{position:absolute;top:14px;padding:10px 16px;border-radius:14px;background:#0d2a18cc;font-weight:700;line-height:1.35;backdrop-filter:blur(4px)}
#hl{left:14px}#hr{right:14px;text-align:right}
.chip small{display:block;font-weight:600;font-size:12px;color:#b8e6c4;letter-spacing:1px}
.chip b{font-size:22px}
#power{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(320px,60vw);height:14px;border-radius:99px;background:#0d2a18aa;overflow:hidden;display:none}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cff8a,#ffe45c,#ff5c5c)}
#tip{position:absolute;bottom:46px;left:0;right:0;text-align:center;font-size:13px;color:#0d2a18;font-weight:700;text-shadow:0 1px 0 #fff8}
#msg{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:40px;font-weight:900;color:#fff;opacity:0;transition:opacity .3s,transform .3s;text-shadow:0 3px 0 #0d2a18,0 0 30px #0008}
#msg.on{opacity:1;transform:translateY(-10px)}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#0d2a18bb,#06140ce8);z-index:5;padding:16px}
.panel[hidden]{display:none}
.card{text-align:center;max-width:min(560px,100%)}
.card h1{font-size:56px;margin:0 0 6px;letter-spacing:2px}
.sub{color:#cdeed6;margin:0 0 16px;line-height:1.5}
.big{display:inline-block;margin:6px;padding:14px 26px;border:0;border-radius:999px;background:#ffe45c;color:#2a2200;font-weight:800;font-size:17px;cursor:pointer}
.big.alt{background:#e8fff0;color:#0d2a18}
.keys{margin-top:16px;font-size:13px;color:#ffffff99;line-height:1.8}
kbd{display:inline-block;padding:1px 7px;border:1px solid #ffffff44;border-radius:5px;font:600 12px ui-monospace,monospace}
table{border-collapse:collapse;margin:8px auto 14px;font-variant-numeric:tabular-nums}
td,th{padding:5px 8px;border-bottom:1px solid #ffffff22;font-size:14px}
th{color:#b8e6c4;font-weight:600}
.u{color:#7cff8a}.o{color:#ff9b8a}
.stat{font-size:48px;font-weight:900;margin:2px 0}
.rec{color:#ffe45c;font-weight:800;letter-spacing:2px}
</style>
</head>
<body>
<div id="hud" hidden>
  <div class="chip" id="hl"></div>
  <div class="chip" id="hr"></div>
  <div id="msg"></div>
  <div id="tip"></div>
  <div id="power"><i></i></div>
</div>
<div class="panel" id="menu">
  <div class="card">
    <h1>MINI GOLFE 30</h1>
    <p class="sub">9 buracos sempre diferentes, com areia, aceleradores, bumpers e barras que giram.<br>Faz o menor número de pancadas possível.</p>
    <p class="sub" id="menuBest"></p>
    <button class="big" id="dailyBtn">Percurso do dia</button><button class="big alt" id="randBtn">Percurso aleatório</button>
    <div class="keys">Arrasta para trás a partir de qualquer ponto e larga para bater<br>ou <kbd>←</kbd> <kbd>→</kbd> para apontar e mantém <kbd>ESPAÇO</kbd> para a força · <kbd>RODA</kbd> faz zoom</div>
  </div>
</div>
<div class="panel" id="between" hidden><div class="card" id="betweenCard"></div></div>
<div class="panel" id="pause" hidden><div class="card"><h1 style="font-size:40px">PAUSA</h1><button class="big" id="resumeBtn">Continuar</button><button class="big alt" id="quitBtn">Menu</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
const HOLES=9,BR=.16,MAXS=8;
function rngOf(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const today=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();};

// ---------- som ----------
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch{}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type='sine',v=.12,slide=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
let clinkT=0;function clink(s){const n=performance.now();if(n-clinkT<60)return;clinkT=n;tone(700+s*40,.06,'triangle',Math.min(.15,.02+s*.012));}

// ---------- cena ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fd3f0);
scene.fog=new THREE.Fog(0x9fd3f0,28,70);
const camera=new THREE.PerspectiveCamera(50,1,.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xe8f6ff,0x3d6b3d,.8));
const sun=new THREE.DirectionalLight(0xfff4dd,.85);sun.position.set(-8,20,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});scene.add(sun,sun.target);
const base=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x4f8f45,roughness:1}));base.rotation.x=-Math.PI/2;base.position.y=-.45;base.receiveShadow=true;scene.add(base);

// bola e mira
const ball=new THREE.Mesh(new THREE.SphereGeometry(BR,20,14),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35}));ball.castShadow=true;scene.add(ball);
const aimGroup=new THREE.Group();
const aimLine=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,1),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85}));aimLine.position.z=-.5;
const aimHead=new THREE.Mesh(new THREE.ConeGeometry(.16,.35,12),new THREE.MeshBasicMaterial({color:0xffffff}));aimHead.rotation.x=-Math.PI/2;
aimGroup.add(aimLine,aimHead);scene.add(aimGroup);aimGroup.visible=false;
const dots=[];for(let i=0;i<10;i++){const d=new THREE.Mesh(new THREE.CircleGeometry(.05,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));d.rotation.x=-Math.PI/2;scene.add(d);dots.push(d);}

// ---------- geração de buracos ----------
let hole=null;
function genHole(seed,n){
  const rng=rngOf(seed*31+n*977+7);
  const W=13,H=15+Math.floor(rng()*7)+Math.floor(n*.8);
  const path=Array.from({length:H},()=>Array(W).fill(0)); // 0 nada, 1 relva, 2 areia, 3 acelerador
  let c=6,shifts=0;const half=n<2?2:1;
  const mark=(x,y)=>{if(x>=1&&x<W-1&&y>=1&&y<H-1)path[y][x]=1;};
  for(let y=H-2;y>=1;y--){
    for(let dx=-half;dx<=1;dx++)mark(c+dx,y);
    if(y<H-4&&y>3&&rng()<.18+n*.02){
      const nc=Math.max(2,Math.min(W-3,c+(rng()<.5?-1:1)*(2+Math.floor(rng()*4))));
      if(nc!==c){for(let x=Math.min(c,nc)-1;x<=Math.max(c,nc)+1;x++){mark(x,y);mark(x,y-1);}shifts+=Math.abs(nc-c);c=nc;}
    }
  }
  const tee={x:6,y:H-2},cup={x:c,y:1};
  // pontos no mundo
  const wx=x=>x-W/2+.5,wz=y=>y-H/2+.5;
  const isP=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&path[y][x]>0;
  // obstáculos
  const feats={bumpers:[],spinners:[],boosts:[]};
  const cand=[];for(let y=3;y<H-3;y++)for(let x=0;x<W;x++)if(isP(x,y)&&Math.abs(y-cup.y)+Math.abs(x-cup.x)>2)cand.push({x,y});
  const nf=Math.min(cand.length>>2,1+Math.floor(n*.7+rng()*2));
  const used=new Set();
  for(let i=0;i<nf&&cand.length;i++){
    const p=cand.splice(Math.floor(rng()*cand.length),1)[0];const key=p.x+','+p.y;if(used.has(key))continue;used.add(key);
    const r=rng();
    const full3=[-1,0,1].every(a=>[-1,0,1].every(b=>isP(p.x+a,p.y+b)));
    if(r<.3&&full3&&n>=2)feats.spinners.push({x:wx(p.x),z:wz(p.y),a:rng()*Math.PI,w:(rng()<.5?-1:1)*(1.1+n*.12)});
    else if(r<.55){for(const [a,b] of [[0,0],[1,0],[0,1],[1,1]])if(isP(p.x+a,p.y+b)&&path[p.y+b][p.x+a]===1)path[p.y+b][p.x+a]=2;}
    else if(r<.75&&n>=1){path[p.y][p.x]=3;const dir=rng()<.6?{x:0,z:-1}:{x:rng()<.5?-1:1,z:0};feats.boosts.push({cx:p.x,cy:p.y,dir});}
    else feats.bumpers.push({x:wx(p.x)+(rng()-.5)*.3,z:wz(p.y)+(rng()-.5)*.3});
  }
  // paredes
  const walls=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isP(x,y)){
    const x0=x-W/2,x1=x0+1,z0=y-H/2,z1=z0+1;
    if(!isP(x,y-1))walls.push([x0,z0,x1,z0]);
    if(!isP(x,y+1))walls.push([x0,z1,x1,z1]);
    if(!isP(x-1,y))walls.push([x0,z0,x0,z1]);
    if(!isP(x+1,y))walls.push([x1,z0,x1,z1]);
  }
  const len=(H-3)+shifts;
  const par=Math.max(2,Math.min(5,2+Math.floor(len/15)+(feats.spinners.length+feats.boosts.length>1?1:0)));
  return{W,H,path,tee:{x:wx(tee.x),z:wz(tee.y)},cup:{x:wx(cup.x),z:wz(cup.y)},walls,feats,par,wx,wz,isP};
}

const holeGroup=new THREE.Group();scene.add(holeGroup);
const tileGeo=new THREE.BoxGeometry(1,.3,1);
const COL={g1:new THREE.Color(0x46b552),g2:new THREE.Color(0x3fa64a),sand:new THREE.Color(0xe6cd86),boost:new THREE.Color(0x2fa0ff)};
const wallMat=new THREE.MeshStandardMaterial({color:0xf3eee0,roughness:.6});
const bumperMat=new THREE.MeshStandardMaterial({color:0xff4d5e,roughness:.4});
const spinMat=new THREE.MeshStandardMaterial({color:0x3d7bff,roughness:.4});
const arrowMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85});
function buildHole(h){
  holeGroup.clear();
  let count=0;for(let y=0;y<h.H;y++)for(let x=0;x<h.W;x++)if(h.path[y][x])count++;
  const tiles=new THREE.InstancedMesh(tileGeo,new THREE.MeshStandardMaterial({roughness:.95}),count);tiles.receiveShadow=true;
  const m4=new THREE.Matrix4();let i=0;
  for(let y=0;y<h.H;y++)for(let x=0;x<h.W;x++){const p=h.path[y][x];if(!p)continue;m4.makeTranslation(h.wx(x),-.15,h.wz(y));tiles.setMatrixAt(i,m4);tiles.setColorAt(i,p===2?COL.sand:p===3?COL.boost:((x+y)%2?COL.g1:COL.g2));i++;}
  holeGroup.add(tiles);
  // paredes (junta segmentos colineares seguidos)
  for(const [x0,z0,x1,z1] of h.walls){const horiz=z0===z1,L=horiz?Math.abs(x1-x0):Math.abs(z1-z0);const m=new THREE.Mesh(new THREE.BoxGeometry(horiz?L+.15:.15,.32,horiz?.15:L+.15),wallMat);m.position.set((x0+x1)/2,.16,(z0+z1)/2);m.castShadow=true;m.receiveShadow=true;holeGroup.add(m);}
  for(const b of h.feats.bumpers){const m=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.35,20),bumperMat);m.position.set(b.x,.17,b.z);m.castShadow=true;holeGroup.add(m);const r=new THREE.Mesh(new THREE.TorusGeometry(.3,.05,8,20),wallMat);r.rotation.x=Math.PI/2;r.position.set(b.x,.35,b.z);holeGroup.add(r);}
  for(const s of h.feats.spinners){const g=new THREE.Group();g.position.set(s.x,0,s.z);const bar=new THREE.Mesh(new THREE.BoxGeometry(2.2,.26,.14),spinMat);bar.position.y=.2;bar.castShadow=true;const post=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.5,12),wallMat);post.position.y=.25;g.add(bar,post);holeGroup.add(g);s.mesh=g;}
  for(const b of h.feats.boosts){const sh=new THREE.Shape();sh.moveTo(0,.32);sh.lineTo(.26,0);sh.lineTo(.1,0);sh.lineTo(.1,-.3);sh.lineTo(-.1,-.3);sh.lineTo(-.1,0);sh.lineTo(-.26,0);sh.closePath();const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),arrowMat);m.rotation.x=-Math.PI/2;m.rotation.z=-Math.atan2(b.dir.x,-b.dir.z);m.position.set(h.wx(b.cx),.01,h.wz(b.cy));holeGroup.add(m);b.mesh=m;}
  // buraco e bandeira
  const cupM=new THREE.Mesh(new THREE.CircleGeometry(.27,24),new THREE.MeshBasicMaterial({color:0x0b1a0f}));cupM.rotation.x=-Math.PI/2;cupM.position.set(h.cup.x,.004,h.cup.z);holeGroup.add(cupM);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1.7,8),wallMat);pole.position.set(h.cup.x,.85,h.cup.z);pole.castShadow=true;holeGroup.add(pole);
  const fs=new THREE.Shape();fs.moveTo(0,0);fs.lineTo(.6,-.2);fs.lineTo(0,-.4);fs.closePath();
  const flag=new THREE.Mesh(new THREE.ShapeGeometry(fs),new THREE.MeshStandardMaterial({color:0xff3b3b,side:THREE.DoubleSide}));flag.position.set(h.cup.x,1.7,h.cup.z);flag.castShadow=true;holeGroup.add(flag);h.flag=flag;
  const teeM=new THREE.Mesh(new THREE.PlaneGeometry(.8,.5),new THREE.MeshBasicMaterial({color:0x2f7d38}));teeM.rotation.x=-Math.PI/2;teeM.position.set(h.tee.x,.003,h.tee.z);holeGroup.add(teeM);
  // árvores à volta
  const rng=rngOf(h.H*999+h.W);
  const trunk=new THREE.MeshStandardMaterial({color:0x7a5230}),leaf=new THREE.MeshStandardMaterial({color:0x2f7a35,flatShading:true});
  for(let k=0;k<26;k++){const x=(rng()*2-1)*20,z=(rng()*2-1)*(h.H/2+8);const gx=Math.floor(x+h.W/2),gy=Math.floor(z+h.H/2);let near=false;for(let a=-2;a<=2&&!near;a++)for(let b=-2;b<=2;b++)if(h.isP(gx+a,gy+b)){near=true;break;}if(near||Math.abs(x)<h.W/2+1&&Math.abs(z)<h.H/2+1)continue;const s=.7+rng()*.8;const t=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.16*s,.8*s,6),trunk);t.position.set(x,-.45+.4*s,z);const c=new THREE.Mesh(new THREE.ConeGeometry(.7*s,1.8*s,7),leaf);c.position.set(x,-.45+1.5*s,z);t.castShadow=c.castShadow=true;holeGroup.add(t,c);}
}

// ---------- estado ----------
let state='menu',paused=false,mode='daily',seed=0,hi=0,strokes=0,card=[],bx=0,bz=0,vx=0,vz=0,moving=false,aimA=-Math.PI/2,power=0,charging=false,chargeDir=1,drag=null,zoom=1,lastSafe={x:0,z:0},sinking=0,sunk=false,tm=0;
const keys={};

function startRound(m){audio();mode=m;seed=m==='daily'?today():Math.floor(Math.random()*1e9);hi=0;card=[];$('menu').hidden=true;$('between').hidden=true;$('hud').hidden=false;loadHole();}
function loadHole(){hole=genHole(seed,hi);buildHole(hole);strokes=0;bx=hole.tee.x;bz=hole.tee.z;vx=vz=0;moving=false;sinking=0;sunk=false;lastSafe={x:bx,z:bz};aimA=Math.atan2(hole.cup.z-bz,hole.cup.x-bx);state='play';msg(`Buraco ${hi+1} · Par ${hole.par}`,1300);updHud();
  camera.position.set(bx,13,bz+9);}
function msg(text,ms=1500){const m=$('msg');m.textContent=text;m.classList.add('on');clearTimeout(msg.t);msg.t=setTimeout(()=>m.classList.remove('on'),ms);}
const total=()=>card.reduce((a,c)=>a+c.s,0),totalPar=()=>card.reduce((a,c)=>a+c.p,0);
const rel=n=>n===0?'PAR':(n>0?'+':'')+n;
function updHud(){
  $('hl').innerHTML=`<small>BURACO ${hi+1}/${HOLES} · PAR ${hole.par}</small><b>${strokes}</b> pancada${strokes===1?'':'s'}`;
  const r=total()-totalPar();
  $('hr').innerHTML=`<small>${mode==='daily'?'PERCURSO DO DIA':'ALEATÓRIO'}</small><b class="${r<0?'u':r>0?'o':''}">${card.length?rel(r):'—'}</b>`;
  $('tip').textContent=moving?'':(strokes===0?'Arrasta para trás e larga · ou ← → e ESPAÇO':'');
}
function shoot(p){if(moving||state!=='play'||p<.35)return;vx=Math.cos(aimA)*p;vz=Math.sin(aimA)*p;moving=true;strokes++;lastSafe={x:bx,z:bz};tone(220+p*20,.08,'triangle',.18,-60);aimGroup.visible=false;$('power').style.display='none';updHud();}
function holed(){
  sinking=1;sunk=true;state='wait';moving=false;vx=vz=0;
  const d=strokes-hole.par;
  const names={'-3':'Albatroz!','-2':'Eagle!','-1':'Birdie!','0':'Par','1':'Bogey','2':'Duplo bogey'};
  const name=strokes===1?'À primeira!!':names[d]??('+'+d);
  msg(name,1800);
  tone(523,.12,'triangle',.15);setTimeout(()=>tone(659,.12,'triangle',.15),120);setTimeout(()=>tone(784,.25,'triangle',.15),240);
  if(strokes===1)window.C30?.unlock?.('golfe-ace','Mini Golfe: buraco à primeira!');
  card.push({s:strokes,p:hole.par});
  setTimeout(()=>showBetween(),1700);
}
function giveUp(){card.push({s:MAXS,p:hole.par});msg('Máximo de pancadas',1400);state='wait';setTimeout(()=>showBetween(),1400);}
function scoreTable(){
  let h='<table><tr><th>Buraco</th>'+card.map((_,i)=>`<th>${i+1}</th>`).join('')+'<th>Total</th></tr>';
  h+='<tr><td>Par</td>'+card.map(c=>`<td>${c.p}</td>`).join('')+`<td>${totalPar()}</td></tr>`;
  h+='<tr><td>Tu</td>'+card.map(c=>`<td class="${c.s<c.p?'u':c.s>c.p?'o':''}">${c.s}</td>`).join('')+`<td><b>${total()}</b></td></tr></table>`;
  return h;
}
function showBetween(){
  state='between';
  const last=hi>=HOLES-1;const r=total()-totalPar();
  let html='';
  if(!last){html=`<div class="sub">BURACO ${hi+1} FEITO</div><div class="stat">${rel(r)}</div>${scoreTable()}<button class="big" id="nextBtn">Buraco ${hi+2} ↗</button><div class="keys"><kbd>ENTER</kbd> para continuar</div>`;}
  else{
    const key=mode==='daily'?'golfe.daily.'+seed:'golfe.best';const prev=store.get(key,null);const rec=prev==null||total()<prev;if(rec)store.set(key,total());
    if(r<=0)window.C30?.unlock?.('golfe-par','Mini Golfe: percurso no par ou abaixo');
    html=`<div class="sub">${mode==='daily'?'PERCURSO DO DIA':'PERCURSO ALEATÓRIO'} TERMINADO</div><div class="stat">${total()} pancadas · ${rel(r)}</div><div class="rec">${rec?'NOVO RECORDE!':'Recorde: '+prev}</div>${scoreTable()}<button class="big" id="nextBtn">Jogar outra vez</button><button class="big alt" id="menuBtn">Menu</button>`;
  }
  $('betweenCard').innerHTML=html;$('between').hidden=false;$('hud').hidden=true;
  $('nextBtn').onclick=next;const mb=$('menuBtn');if(mb)mb.onclick=toMenu;
}
function next(){if(state!=='between')return;$('between').hidden=true;$('hud').hidden=false;if(hi>=HOLES-1){startRound(mode);return;}hi++;loadHole();}
function toMenu(){state='menu';paused=false;for(const p of ['between','pause'])$(p).hidden=true;$('hud').hidden=true;$('menu').hidden=false;menuBest();}
function menuBest(){const d=store.get('golfe.daily.'+today(),null),b=store.get('golfe.best',null);$('menuBest').innerHTML=[d!=null?'Hoje: '+d+' pancadas':'',b!=null?'Melhor aleatório: '+b:''].filter(Boolean).join(' · ');}

// ---------- física ----------
function closestOnSeg(px,pz,ax,az,bx_,bz_){const dx=bx_-ax,dz=bz_-az,l=dx*dx+dz*dz;let t=l?((px-ax)*dx+(pz-az)*dz)/l:0;t=Math.max(0,Math.min(1,t));return[ax+dx*t,az+dz*t];}
function collideSeg(ax,az,bx_,bz_,th,e,svx=0,svz=0){
  const [cx,cz]=closestOnSeg(bx,bz,ax,az,bx_,bz_);let nx=bx-cx,nz=bz-cz;const d=Math.hypot(nx,nz),min=BR+th;
  if(d>=min||d<1e-6)return;nx/=d;nz/=d;bx=cx+nx*min;bz=cz+nz*min;
  const rvx=vx-svx,rvz=vz-svz,vn=rvx*nx+rvz*nz;if(vn<0){vx-=(1+e)*vn*nx;vz-=(1+e)*vn*nz;clink(-vn);}
}
function cellAt(x,z){const gx=Math.floor(x+hole.W/2),gy=Math.floor(z+hole.H/2);return hole.isP(gx,gy)?hole.path[gy][gx]:0;}
function physics(dt){
  const sub=6,h=dt/sub;
  for(let s=0;s<sub;s++){
    const cell=cellAt(bx,bz);
    if(cell===3){const b=hole.feats.boosts.find(b=>Math.floor(bx+hole.W/2)===b.cx&&Math.floor(bz+hole.H/2)===b.cy);if(b){vx+=b.dir.x*14*h;vz+=b.dir.z*14*h;}}
    const k=cell===2?4.2:1.05;const sp=Math.hypot(vx,vz);
    if(sp>0){const ns=Math.max(0,sp-(sp*k+.6)*h);vx*=ns/sp;vz*=ns/sp;}
    // atração do buraco
    const cdx=hole.cup.x-bx,cdz=hole.cup.z-bz,cd=Math.hypot(cdx,cdz);
    if(cd<.42&&sp<3){vx+=cdx/cd*3.5*h;vz+=cdz/cd*3.5*h;}
    bx+=vx*h;bz+=vz*h;
    for(const w of hole.walls)collideSeg(w[0],w[1],w[2],w[3],.075,.72);
    for(const b of hole.feats.bumpers){const dx=bx-b.x,dz=bz-b.z,d=Math.hypot(dx,dz),min=BR+.3;if(d<min&&d>1e-6){const nx=dx/d,nz=dz/d;bx=b.x+nx*min;bz=b.z+nz*min;const vn=vx*nx+vz*nz;if(vn<0){vx-=2.1*vn*nx;vz-=2.1*vn*nz;tone(520,.1,'square',.06,200);}}}
    for(const sp_ of hole.feats.spinners){const ca=Math.cos(sp_.a),sa=Math.sin(sp_.a),ax=sp_.x-ca*1.1,az=sp_.z-sa*1.1,ex=sp_.x+ca*1.1,ez=sp_.z+sa*1.1;
      const [cx,cz]=closestOnSeg(bx,bz,ax,az,ex,ez);const rx=cx-sp_.x,rz=cz-sp_.z;collideSeg(ax,az,ex,ez,.08,.6,-sp_.w*rz,sp_.w*rx);
      const dp=Math.hypot(bx-sp_.x,bz-sp_.z);if(dp<BR+.12){const nx=(bx-sp_.x)/(dp||1),nz=(bz-sp_.z)/(dp||1);bx=sp_.x+nx*(BR+.12);bz=sp_.z+nz*(BR+.12);}}
    const v2=Math.hypot(vx,vz);
    if(Math.hypot(hole.cup.x-bx,hole.cup.z-bz)<.24&&v2<5.5){bx=hole.cup.x;bz=hole.cup.z;holed();return;}
    // segurança: se sair do percurso, volta ao último sítio
    if(!cellAt(bx,bz)){bx=lastSafe.x;bz=lastSafe.z;vx=vz=0;}
  }
  const sp=Math.hypot(vx,vz);
  if(sp<.05){vx=vz=0;moving=false;if(strokes>=MAXS){giveUp();return;}aimA=Math.atan2(hole.cup.z-bz,hole.cup.x-bx);updHud();}
}

// ---------- ciclo ----------
let last=performance.now();
const ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),tmpV=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;tm+=dt;
  if(state==='menu'){if(!hole){hole=genHole(today(),3);buildHole(hole);bx=hole.tee.x;bz=hole.tee.z;}const a=tm*.15;camera.position.set(Math.sin(a)*16,12,Math.cos(a)*16);camera.lookAt(0,0,0);ball.position.set(bx,BR,bz);renderer.render(scene,camera);return;}
  if(!paused&&hole){
    for(const s of hole.feats.spinners){s.a+=s.w*dt;s.mesh.rotation.y=-s.a;}
    if(hole.flag)hole.flag.rotation.y=Math.sin(tm*2)*.25;
    for(const b of hole.feats.boosts)b.mesh.material.opacity=.55+Math.sin(tm*6)*.3;
    if(state==='play'){
      if(moving)physics(dt);
      else{
        if(keys.ArrowLeft||keys.KeyA)aimA-=dt*1.6;
        if(keys.ArrowRight||keys.KeyD)aimA+=dt*1.6;
        if(charging){power+=chargeDir*dt*13;if(power>15){power=15;chargeDir=-1;}if(power<0){power=0;chargeDir=1;}}
      }
    }
  }
  if(sinking>0){sinking=Math.max(0,sinking-dt*2.5);}
  ball.position.set(bx,sunk?BR-(1-sinking)*.4:BR,bz);
  ball.rotation.x+=vz*dt/BR;ball.rotation.z-=vx*dt/BR;
  // mira
  const showAim=state==='play'&&!moving&&!paused;
  aimGroup.visible=showAim&&(power>.2||!!drag);
  dots.forEach((d,i)=>{d.visible=showAim;const r=.45+i*.32;d.position.set(bx+Math.cos(aimA)*r,.02,bz+Math.sin(aimA)*r);d.material.opacity=.6*(1-i/10);});
  if(aimGroup.visible){const L=.3+power*.18;aimGroup.position.set(bx,.05,bz);aimGroup.rotation.y=-aimA-Math.PI/2;aimLine.scale.z=L;aimLine.position.z=-L/2-.2;aimHead.position.z=-L-.3;const c=new THREE.Color().setHSL(.33-power/15*.33,1,.6);aimLine.material.color.copy(c);aimHead.material.color.copy(c);}
  $('power').style.display=showAim&&power>.2?'block':'none';$('power').firstElementChild.style.width=(power/15*100)+'%';
  // câmara
  const tgt=new THREE.Vector3(bx,0,bz-1.5);
  const want=new THREE.Vector3(bx,10.5*zoom,bz+7.5*zoom);
  camera.position.lerp(want,1-Math.pow(.02,dt));
  camera.lookAt(tgt.x,0,camera.position.z-7.5*zoom-1.5);
  sun.position.set(bx-8,20,bz+10);sun.target.position.set(bx,0,bz);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);

// ---------- entrada ----------
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();if(state==='play'&&!moving&&!paused&&!e.repeat){charging=true;power=0;chargeDir=1;}}
  if(e.code==='Enter'&&!e.repeat){if(state==='between')next();else if(paused)setPause(false);}
  if(e.code==='KeyP')setPause(!paused);
  if(e.code.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space'&&charging){charging=false;const p=power;power=0;shoot(p);}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;charging=false;power=0;});
function groundAt(cx,cy){ray.setFromCamera({x:cx/innerWidth*2-1,y:-(cy/innerHeight)*2+1},camera);return ray.ray.intersectPlane(plane,new THREE.Vector3());}
renderer.domElement.addEventListener('pointerdown',e=>{if(state!=='play'||moving||paused)return;const p=groundAt(e.clientX,e.clientY);if(!p)return;drag={id:e.pointerId,start:p};power=0;renderer.domElement.setPointerCapture?.(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const p=groundAt(e.clientX,e.clientY);if(!p)return;const dx=drag.start.x-p.x,dz=drag.start.z-p.z,l=Math.hypot(dx,dz);if(l>.15){aimA=Math.atan2(dz,dx);power=Math.min(15,l*2.6);}else power=0;});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;drag=null;const p=power;power=0;shoot(p);};
renderer.domElement.addEventListener('pointerup',endDrag);renderer.domElement.addEventListener('pointercancel',e=>{drag=null;power=0;});
addEventListener('wheel',e=>{zoom=Math.max(.6,Math.min(2.2,zoom*(e.deltaY>0?1.1:.9)));},{passive:true});
$('dailyBtn').onclick=()=>startRound('daily');$('randBtn').onclick=()=>startRound('random');
$('resumeBtn').onclick=()=>setPause(false);$('quitBtn').onclick=toMenu;

// ---------- pausa (ESC na Central 30) ----------
function setPause(p){if(state!=='play'&&state!=='wait'){paused=false;return;}paused=p;$('pause').hidden=!p;if(p){charging=false;power=0;drag=null;}}
window.C30pause=force=>setPause(force===true?true:force===false?false:!paused);
window.C30isPaused=()=>paused;
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);});
menuBest();
</script>
